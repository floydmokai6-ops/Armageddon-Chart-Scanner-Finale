h1{margin:0;font:700 19px/1 Georgia,"Times New Roman",serif;letter-spacing:3.5px;background:linear-gradient(90deg,var(--gold),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:10.5px;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;margin-top:3px}
.pill{border:1px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;letter-spacing:.6px;white-space:nowrap}
.pill.ok{border-color:var(--up);color:var(--up);box-shadow:0 0 10px rgba(59,224,143,.3)}.pill.demo{border-color:var(--ember);color:var(--ember)}.pill.bad{border-color:var(--dn);color:var(--dn)}.pill.wait{color:var(--gold);border-color:#5a3a12}
main{padding:12px 12px 8px;max-width:760px;margin:0 auto}
h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold)}
small,.mu{color:var(--mut);font-size:12.5px}.pad{padding:14px 4px}.up{color:var(--up)}.dn{color:var(--dn)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 0 16px rgba(255,80,10,.07)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}.row label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
button,select,input{font:inherit;color:var(--tx)}
select,input[type=text],input:not([type]),input[type=datetime-local],input[inputmode]{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-height:42px}
button{cursor:pointer}
.chips{display:flex;gap:8px;margin:0 0 10px}.chips.scroll{overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card2);border:1px solid var(--bd);border-radius:999px;padding:9px 15px;min-height:40px;font-weight:600;white-space:nowrap}
.chip.sm{padding:6px 12px;min-height:34px;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--ember),var(--red));border-color:var(--ember);color:#fff;box-shadow:0 0 12px rgba(255,80,10,.45)}
.sw{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px;text-transform:none!important;letter-spacing:0!important;color:var(--tx)!important;flex-direction:row!important}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ember);flex:none}
.sy{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:11px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card)}
.sy.on{border-color:var(--ember);box-shadow:0 0 10px rgba(255,106,26,.35)}.sy .l b{font-size:16px}.sy small{display:block}.sy .rt{text-align:right}.sy .rt b{font-size:16px}.sy .bd{grid-column:1/3;justify-self:start}
.bd{font-size:11.5px;font-weight:700;border:1px solid;border-radius:7px;padding:2px 8px;white-space:nowrap}.bd.up{border-color:var(--up)}.bd.dn{border-color:var(--dn)}.bd.nu{color:var(--mut);border-color:var(--bd);font-weight:400}
.tag{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);border:1px solid #5a3a12;border-radius:6px;padding:0 6px}
.px{font-size:22px;font-weight:700}.px small{font-size:12px;font-weight:600}
.nav{background:var(--card2);border:1px solid var(--bd);border-radius:12px;width:46px;height:46px;font-size:26px;line-height:1}
.legend{font-size:11.5px;color:var(--mut);margin:6px 0 2px}
.sg{border:1px solid var(--bd);border-left:4px solid var(--ember);border-radius:12px;padding:11px;margin-bottom:12px;background:var(--card)}.sg.b{border-left-color:var(--up)}.sg.s{border-left-color:var(--dn)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.sym{font-size:17px}.st{font-size:12px;color:var(--mut)}.sm{font-size:12px;color:var(--mut);margin:3px 0}.ttl{font-weight:700;margin-top:4px}
.gr{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 12px;font-size:14px;margin:8px 0}.gr i{font-style:normal;color:var(--mut)}
.cf{height:20px;background:#2a130c;border-radius:10px;position:relative;overflow:hidden;margin:7px 0}.cf div{height:100%;background:linear-gradient(90deg,var(--red),var(--ember),var(--gold));opacity:.85}.cf span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:20px;font-weight:700;text-shadow:0 0 4px #000}
.why{margin-top:8px;padding:9px 11px;background:#0f0706;border:1px dashed #4a2414;border-radius:10px}.why b{color:var(--gold);font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase}
.why ul{list-style:none;margin:5px 0 0;padding:0}.why li{font-size:13.5px;padding:3px 0 3px 18px;position:relative}.why li:before{content:"▸";position:absolute;left:2px;color:var(--ember)}
.ev{padding:9px 2px;border-bottom:1px solid var(--bd);font-size:14px}.ev small{display:block}
.nw{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.hi{color:var(--dn);font-size:11px;font-weight:700}.x{background:none;border:0;color:var(--dn);font-size:18px;padding:4px 8px}
.form{display:grid;gap:8px}.form input,.form select{width:100%}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;border:1px solid var(--bd);background:var(--card2)}.banner.bad{border-color:var(--dn)}.banner.wait{border-color:#5a3a12;color:var(--gold)}.banner.demo{border-color:var(--ember);color:var(--gold)}
details.grp{border:1px solid var(--bd);border-radius:10px;margin:6px 0;padding:2px 10px;background:var(--card)}details.grp summary{padding:10px 0;font-weight:600;cursor:pointer}
label.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}label.chk small{margin-left:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(14,7,5,.97);border-top:1px solid var(--ember);padding-bottom:var(--sab);box-shadow:0 -4px 20px rgba(255,80,10,.2)}
.tabbar button{flex:1;position:relative;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;letter-spacing:.5px;color:var(--mut);min-height:58px}
.tabbar .ic{font-size:21px;line-height:1;filter:grayscale(.7)}.tabbar button.on{color:var(--gold)}.tabbar button.on .ic{filter:none;text-shadow:0 0 10px var(--ember)}
.tabbar em{position:absolute;top:5px;left:calc(50% + 8px);background:var(--ember);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
#toast{position:fixed;left:12px;right:12px;bottom:calc(74px + var(--sab));z-index:40;background:var(--card);border:1px solid var(--ember);border-radius:12px;padding:11px 13px;font-size:14px;box-shadow:0 0 18px rgba(255,80,10,.5);opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:none}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(600px 400px at 50% 35%,#3a1208,#0a0605);transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}#splash img{width:140px;height:140px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 40px rgba(255,106,26,.8);animation:pulse 1.6s infinite}
#splash div{font:700 24px Georgia,serif;letter-spacing:6px;color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 60px rgba(255,106,26,1)}}

/* ---- big, sharp, live chart ---- */
.chartwrap{background:#06080b;border:1px solid var(--bd);border-radius:14px;padding:8px;margin:0 -4px 12px}
.chhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}#ch-title{text-align:center;flex:1}
.tfbar{display:flex;gap:6px;margin:2px 0 8px;overflow-x:auto;scrollbar-width:none}.tfbar::-webkit-scrollbar{display:none}
.canvaswrap{position:relative}
#cv{display:block;width:100%;height:clamp(360px,calc(100vh - 330px),640px);height:clamp(360px,calc(100dvh - 330px),640px);border-radius:8px;touch-action:none;background:#06080b;cursor:crosshair;user-select:none;-webkit-user-select:none}
.ctools{position:absolute;right:72px;top:6px;display:flex;gap:6px}
.ctools button{width:38px;height:38px;border-radius:10px;background:rgba(20,11,9,.88);border:1px solid var(--bd);font-size:18px;line-height:1;padding:0}
@media (orientation:landscape) and (max-height:520px){#cv{height:calc(100vh - 140px);height:calc(100dvh - 140px);min-height:200px}}
body.fs .top,body.fs .tabbar{display:none}
body.fs{padding-bottom:0}
body.fs main{padding:0;max-width:none}
body.fs .chartwrap{position:fixed;inset:0;z-index:60;margin:0;border:0;border-radius:0;padding:calc(6px + var(--sat)) 6px calc(6px + var(--sab));display:flex;flex-direction:column;background:#06080b}
body.fs .canvaswrap{flex:1;min-height:0}
body.fs #cv{height:100%;min-height:0}
body.fs #ch-sigs,body.fs .legend{display:none}


.ai{margin:10px 0 4px;padding:9px 11px;border:1px solid rgba(255,106,26,.45);border-radius:12px;background:rgba(255,106,26,.07);font-size:13px;line-height:1.45}.ai ul{margin:6px 0 4px 18px;padding:0}.ai .chip{margin-top:2px}
</style>
</head>

  min_wick: 0.5, body_mult: 2.0, close_zone: 0.6, min_range_atr: 0.8,
  sl_atr: 0.25, retrace: 0.5, tp: [1.0, 2.0, 3.0], min_conf: 70, level_atr: 0.6, min_risk_atr: 1.3, max_risk_atr: 3.5, max_spread_r: 0.12, cooldown_candles: 8, htf_filter: true,
  pending_candles: 12, breakeven_after_tp1: true,
  news_lead_min: 30, news_stop_atr: 0.8, news_sl_atr: 1.2, news_expiry_min: 5, blackout_min: 5,
  scalp_tp: [1.0, 1.5, 2.0], scalp_expiry: 3, ict_tp: [1.5, 2.5, 4.0], ict_expiry: 12, ict_disp_atr: 0.9,
  pa_tp: [1.0, 2.0, 3.0], pa_expiry: 8,
  sr_tp: [1.0, 2.0, 3.0], sr_expiry: 8, bo_tp: [1.0, 2.0, 3.5], bo_expiry: 6, tl_tp: [1.0, 2.0, 3.0], tl_expiry: 8, smc_tp: [1.5, 2.5, 4.0], smc_expiry: 12, mid_tp: [1.0, 2.0, 3.0], mid_expiry: 8, as_tp: [0.8, 1.2, 1.8], as_expiry: 3, zz_expiry: 8, mr_expiry: 6,
};
const params = (over = {}) => ({ ...DEFAULTS, ...over });

// Python-style rounding (half to even) so results match the validated reference exactly.
function pyRound(x) {
  const f = Math.floor(x), d = x - f;
  return d < 0.5 ? f : d > 0.5 ? f + 1 : (f % 2 === 0 ? f : f + 1);
}

// ---------------------------------------------------------------- indicators
function ema(vals, n) {
  const k = 2 / (n + 1);
  let e = vals[0];
  return vals.map(v => (e = v * k + e * (1 - k)));
}
function atr(c, n = 14) {
  let s = 0;
  for (let i = c.length - n; i < c.length; i++) {
    const k = c[i], p = c[i - 1];
    s += Math.max(k.h - k.l, Math.abs(k.h - p.c), Math.abs(k.l - p.c));
  }
  return s / n;
}
function rsi(c, n = 14) {
  let g = 0, l = 0;
  for (let i = c.length - n; i < c.length; i++) {
    const d = c[i].c - c[i - 1].c;
    if (d > 0) g += d; else l -= d;
  }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
function swingLevels(c, side = 3, keep = 8) {
  const out = [];
  for (let i = side; i < c.length - side; i++) {
    const h = c[i].h, l = c[i].l, win = c.slice(i - side, i + side + 1);
    if (win.every(x => x.h <= h)) out.push({ price: h, type: 'R' });
    if (win.every(x => x.l >= l)) out.push({ price: l, type: 'S' });
  }
  return out.slice(-keep);
}
function analyze(closed) {
  const cl = closed.map(k => k.c);
  const e20 = ema(cl, 20).at(-1), e50 = ema(cl, 50).at(-1);
  return { candle_time: closed.at(-1).t, close: closed.at(-1).c, atr: atr(closed), rsi: rsi(closed),
    ema20: e20, ema50: e50, bias: e20 > e50 ? 'UP' : 'DOWN', levels: swingLevels(closed.slice(-150)) };
}

// ------------------------------------------------------------------- signals
const tps = (entry, d, r, mults) => mults.map(m => entry + d * r * m);

function detectShadow(closed, P, blackout = false) {
  if (closed.length < 60) return null;
  const L = closed.at(-1);
  const rg = L.h - L.l;
  const A = atr(closed);
  if (rg <= 0 || A <= 0 || rg < A * P.min_range_atr) return null;
  const body = Math.abs(L.c - L.o);
  const lo = Math.min(L.o, L.c) - L.l;
  const up = L.h - Math.max(L.o, L.c);
  let d, sh, ext;
  if (lo >= rg * P.min_wick && lo >= body * P.body_mult && (L.c - L.l) / rg >= P.close_zone) { d = 1; sh = lo; ext = L.l; }
  else if (up >= rg * P.min_wick && up >= body * P.body_mult && (L.h - L.c) / rg >= P.close_zone) { d = -1; sh = up; ext = L.h; }
  else return null;
  const an = analyze(closed);
  const nearLv = an.levels.some(x => Math.abs(x.price - ext) < A * P.level_atr && x.type === (d > 0 ? 'S' : 'R'));
  const nearEma = Math.abs(an.ema50 - ext) < A * P.level_atr;
  const trend = d > 0 ? an.ema20 > an.ema50 : an.ema20 < an.ema50;
  const rsiOk = d > 0 ? an.rsi < 45 : an.rsi > 55;
  let conf = 40 + Math.min(20, (sh / rg - 0.5) * 80) + (nearLv ? 15 : 0) + (nearEma ? 5 : 0) + (trend ? 12 : 0) + (rsiOk ? 8 : 0);
  const side = d > 0 ? 'buyers' : 'sellers';
  const why = [`${d > 0 ? 'Lower' : 'Upper'} shadow is ${(sh / rg * 100).toFixed(0)}% of the candle range - ${side} rejected the move and closed back near the ${d > 0 ? 'high' : 'low'}`];
  if (nearLv) why.push('The rejection happened right at ' + (d > 0 ? 'support' : 'resistance') + ' (a recent swing ' + (d > 0 ? 'low' : 'high') + ')');
  if (nearEma) why.push('EMA50 sits at the rejection point - extra confluence');
  why.push(trend ? (d > 0 ? 'EMA20 above EMA50: trend favours buying' : 'EMA20 below EMA50: trend favours selling')
                 : 'Trend (EMA20/50) is against the trade - lower confidence');
  if (rsiOk) why.push(`RSI ${an.rsi.toFixed(0)} supports a ` + (d > 0 ? 'bounce' : 'pullback lower'));
  if (blackout) { conf -= 10; why.push('A high-impact news release is within the blackout window (-10 confidence)'); }
  conf = Math.min(99, pyRound(conf));
  if (conf < P.min_conf) return null;
  return { strategy: 'SHADOW_ENTRY', code: 'SE', title: (d > 0 ? 'Bullish' : 'Bearish') + ' shadow rejection',
    dir: d, level: ext + d * sh * P.retrace, sl: ext - d * A * P.sl_atr, mults: P.tp,
    conf, reasons: why, t: L.t, ext, atr: A, tol: A * 0.1, zone: [], expiry: P.pending_candles, sh, rg,
    sl_why: `SL sits just beyond the shadow extreme (+${P.sl_atr} ATR): if price trades there the rejection has failed` };
}

function buildSignal(meta, tf, setup, bid, ask, P, now, digits) {
  const d = setup.dir, A = setup.atr, buy = d > 0;
  const f = v => v.toFixed(digits);
  const { level, tol, sl } = setup;
  const px = buy ? ask : bid;
  const market = buy ? px <= level + tol : px >= level - tol;
  const entry = market ? px : level;
  if ((buy && entry <= sl) || (!buy && entry >= sl)) return null;
  // 2.8 FIX: stops tighter than normal candle noise get tagged before the idea can play out.
  // Force the stop to at least min_risk_atr x ATR from entry (never tighter), and skip trades that need an absurdly wide stop.
  let sl2 = sl;
  if (!setup.fixedTargetDistance && setup.strategy !== 'NEWS_STRADDLE') {
    const minR = P.min_risk_atr * A;
    if (Math.abs(entry - sl2) < minR) { sl2 = entry - d * minR; setup.sl_why += `; stop widened to ${P.min_risk_atr} ATR from entry so normal candle noise cannot tag it`; }
    if (Math.abs(entry - sl2) > P.max_risk_atr * A) return null;
  }
  setup.sl = sl2;
  const r = Math.abs(entry - sl2);
  if (r <= 0) return null;
  // spread eats too much of the risk -> skip (kills scalps on wide-spread symbols)
  if (!setup.fixedTargetDistance && (ask - bid) > P.max_spread_r * r) return null;
  const m = setup.mults, tp = setup.fixedTargetDistance ? [entry + d * setup.fixedTargetDistance, entry + d * setup.fixedTargetDistance, entry + d * setup.fixedTargetDistance] : tps(entry, d, r, m), verb = buy ? 'BUY' : 'SELL';
  const why = [...setup.reasons];
  if (market) why.push(`MARKET ${verb}: price (${f(px)}) is already inside the entry zone, so the trade is opened now`);
  else why.push(`PENDING ${verb} LIMIT at ${f(level)}: price (${f(px)}) is still ${f(Math.abs(px - level))} ${buy ? 'above' : 'below'} the entry zone, so the order waits for a pullback instead of chasing`);
  why.push(setup.sl_why);
  if (setup.fixedTargetDistance) why.push(`Fixed 50-pip target: ${f(setup.fixedTargetDistance)} price units from entry vs a planned stop of ${f(r)} (reward:risk ${(setup.fixedTargetDistance / r).toFixed(2)}). Pip size is a per-symbol setting`); else why.push(`TP1 / TP2 / TP3 sit at ${m[0]}R / ${m[1]}R / ${m[2]}R from entry (risk = ${f(r)})`);
  return {
    id: `${meta.name}-${setup.code}-${setup.t}-${buy ? 'B' : 'S'}`, symbol: meta.name, category: meta.category,
    strategy: setup.strategy, direction: verb, order_type: market ? 'MARKET' : `${verb}_LIMIT`, entry, sl: sl2,
    tp1: tp[0], tp2: tp[1], tp3: tp[2], confidence: setup.conf, state: market ? 'ACTIVE' : 'PENDING',
    timeframe: tf, digits, created: now, expires: market ? 0 : now + setup.expiry * TF_SECONDS[tf],
    activated: market ? now : 0, hits: 0, sl_initial: sl2, atr: A, candle_t: setup.t, ext: setup.ext, oco: '',
    reasons: why, news: {}, regime: setup.regime || '', title: setup.title, zone: [...(setup.zone || [])],
    summary: `${setup.title} - ${verb} ${market ? 'at market' : 'limit order (pending)'}`,
  };
}

function buildNewsStraddle(meta, tf, event, A, bid, ask, P, now, digits) {
  const out = [], r = A * P.news_sl_atr, mins = Math.max(1, pyRound((event.ts - now) / 60));
  const oco = `${meta.name}-NW-${Math.trunc(event.ts)}`;
  for (const d of [1, -1]) {
    const entry = d > 0 ? ask + A * P.news_stop_atr : bid - A * P.news_stop_atr;
    const sl = entry - d * r, tp = tps(entry, d, r, P.tp), verb = d > 0 ? 'BUY' : 'SELL';
    out.push({
      id: `${oco}-${d > 0 ? 'B' : 'S'}`, symbol: meta.name, category: meta.category, strategy: 'NEWS_STRADDLE',
      direction: verb, order_type: `${verb}_STOP`, entry, sl, tp1: tp[0], tp2: tp[1], tp3: tp[2],
      confidence: 66 + (mins < 10 ? 4 : 0), state: 'PENDING', timeframe: tf, digits, created: now,
      expires: event.ts + P.news_expiry_min * 60, activated: 0, hits: 0, sl_initial: sl, atr: A, candle_t: 0, ext: 0, oco,
      reasons: [`${event.title} (${event.ccy}) is a HIGH-impact release in ~${mins} min - price usually spikes`,
        `PENDING ${verb} STOP ${(A * P.news_stop_atr).toFixed(digits)} ${d > 0 ? 'above' : 'below'} the market: it only triggers if the spike goes this way`,
        'OCO straddle: the opposite stop is cancelled as soon as one side triggers',
        `SL is ${P.news_sl_atr} ATR from entry; TP1 / TP2 / TP3 at 1R / 2R / 3R`],
      news: { title: event.title, currency: event.ccy, time: event.ts }, title: `News straddle: ${event.title}`,
      zone: [], summary: `${verb} STOP (pending) ahead of ${event.title}`,
    });
  }
  return out;
}

// Move a signal through its lifecycle on a price update. Returns [[event, reason], ...].
function advance(s, bid, ask, now, P) {
  const ev = [], buy = s.direction === 'BUY';
  const [pxIn, pxOut] = buy ? [ask, bid] : [bid, ask];
  if (s.state === 'PENDING') {
    let filled, invalid, missed;
    if (s.order_type === 'BUY_LIMIT' || s.order_type === 'SELL_LIMIT') {
      filled = buy ? pxIn <= s.entry : pxIn >= s.entry;
      invalid = buy ? pxOut <= s.sl : pxOut >= s.sl;
      missed = buy ? pxOut >= s.tp1 : pxOut <= s.tp1;
    } else {
      filled = buy ? pxIn >= s.entry : pxIn <= s.entry;
      invalid = missed = false;
    }
    if (invalid) { s.state = 'CANCELLED'; ev.push(['cancelled', 'invalidated: price broke the stop-loss before entry']); }
    else if (filled) { s.state = 'ACTIVE'; s.activated = now; ev.push(['activated', '']); }
    else if (missed) { s.state = 'CANCELLED'; ev.push(['cancelled', 'missed: price reached TP1 without filling']); }
    else if (now > s.expires) { s.state = 'EXPIRED'; ev.push(['expired', '']); }
    if (s.state !== 'ACTIVE') return ev;
  }
  if (s.state === 'ACTIVE') {
    if (buy ? pxOut <= s.sl : pxOut >= s.sl) {
      if (s.hits && Math.abs(s.sl - s.entry) < 1e-12) { s.state = 'CLOSED_BE'; ev.push(['breakeven', 'stopped at entry after TP1']); }
      else { s.state = 'SL_HIT'; ev.push(['sl', '']); }
      return ev;
    }
    if (s.strategy === '714_METHOD') {
      if (buy ? pxOut >= s.tp1 : pxOut <= s.tp1) {
        s.hits = 1; s.state = 'COMPLETED'; ev.push(['target714', '']);
      }
      return ev;
    }
    while (s.hits < 3) {
      const tp = [s.tp1, s.tp2, s.tp3][s.hits];
      if (buy ? pxOut >= tp : pxOut <= tp) {
        s.hits += 1;
        ev.push([`tp${s.hits}`, '']);
        if (s.hits === 1 && P.breakeven_after_tp1) s.sl = s.entry;
        if (s.hits === 3) s.state = 'COMPLETED';
      } else break;
    }
  }
  return ev;
}

// Public (rounded) view of a signal, as shown in the UI.
function publicSignal(s) {
  const r = s.digits, rd = v => Number(v.toFixed(r));
  const risk = Math.abs(s.entry - s.sl_initial) || 1;
  return { ...s, entry: rd(s.entry), sl: rd(s.sl), tp1: rd(s.tp1), tp2: rd(s.tp2), tp3: rd(s.tp3), sl_initial: rd(s.sl_initial),
    atr: rd(s.atr), ext: rd(s.ext), zone: s.zone.map(rd),
    risk_reward: [s.tp1, s.tp2, s.tp3].map(t => Number((Math.abs(t - s.entry) / risk).toFixed(2))) };
}

// ------------------------------------------------------------------- storage
class Book {
  constructor(storage = null, key = 'acs_book') {
    this.storage = storage; this.key = key;
    this.signals = new Map(); this.flags = new Set(); this.settings = {};
    if (storage) {
      try {
        const d = JSON.parse(storage.getItem(key) || 'null');
        if (d) { for (const x of d.signals || []) this.signals.set(x.id, x); this.flags = new Set(d.flags || []); this.settings = d.settings || {}; }
      } catch (e) { /* ignore corrupt state */ }
    }
  }
  add(s) {
    this.signals.set(s.id, s);
    const done = [...this.signals].filter(([, v]) => v.state !== 'PENDING' && v.state !== 'ACTIVE').map(([k]) => k);
    for (const k of done.slice(0, Math.max(0, done.length - 200))) this.signals.delete(k);
  }
  live(symbol = null) {
    return [...this.signals.values()].filter(s => (s.state === 'PENDING' || s.state === 'ACTIVE') && (symbol === null || s.symbol === symbol));
  }
  save() {
    if (!this.storage) return;
    try {
      this.storage.setItem(this.key, JSON.stringify({ signals: [...this.signals.values()], flags: [...this.flags].slice(-500), settings: this.settings }));
    } catch (e) { /* storage full or blocked */ }
  }
}

// ---- strategies.js
// Scalping, ICT and Price Action strategies.
// Every rule is written once for BUY setups; SELL setups are found by mirroring the candles
// (prices negated), so buy/sell logic can never drift apart. Each rule returns a "setup" object
// that engine.buildSignal() turns into a market or pending signal with a written explanation.

const HTF = { M1: 'M15', M5: 'H1', M15: 'H4', M30: 'H4', H1: 'H4', H4: 'D1' };
const WORDS = {
  '1': { lo: 'low', hi: 'high', under: 'below', over: 'above', sup: 'support', bull: 'bullish', liq: 'sell-side', liq2: 'buy-side', cheap: 'discount', op: '>', buyers: 'buyers', sellers: 'sellers' },
  '-1': { lo: 'high', hi: 'low', under: 'above', over: 'below', sup: 'resistance', bull: 'bearish', liq: 'buy-side', liq2: 'sell-side', cheap: 'premium', op: '<', buyers: 'sellers', sellers: 'buyers' },
};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const mirror = K => K.map(k => ({ t: k.t, o: -k.o, h: -k.l, l: -k.h, c: -k.c }));

function swings(K, side = 3) {
  const out = [];
  for (let i = side; i < K.length - side; i++) {
    const h = K[i].h, l = K[i].l, win = K.slice(i - side, i + side + 1);
    if (win.every(x => x.h <= h)) out.push({ idx: i, type: 'H', price: h });
    if (win.every(x => x.l >= l)) out.push({ idx: i, type: 'L', price: l });
  }
  return out;
}

function htfUp(H) {
  if (!H || H.length < 30) return null;
  const cl = H.map(k => k.c);
  return ema(cl, 20).at(-1) > ema(cl, 50).at(-1);
}

const mk = (strategy, code, title, level, sl, mults, conf, reasons, sl_why, t, ext, A, tol, expiry, zone = []) =>
  ({ strategy, code, title, level, sl, mults, conf: Math.min(99, pyRound(conf)), reasons, sl_why, t, ext, atr: A, tol, expiry, zone: [...zone] });

function htfAdj(conf, reasons, hb, c) {
  if (hb === true) { reasons.push(`Higher-timeframe trend is ${c.w.bull} - it agrees with this trade`); return conf + 8; }
  if (hb === false) { reasons.push('Higher-timeframe trend is against this trade - confidence reduced'); return conf - 8; }
  return conf;
}

// ------------------------------------------------------------------ SCALPING
function scalp(K, H, P, c) {
  const n = K.length;
  if (n < 60) return null;
  const A = atr(K), cl = K.map(k => k.c);
  const e9 = ema(cl, 9).at(-1), e21 = ema(cl, 21).at(-1), e50 = ema(cl, 50).at(-1);
  if (!(e9 > e21 && e21 > e50)) return null;
  const L = K[n - 1], Pv = K[n - 2];
  const rg = L.h - L.l, body = L.c - L.o;
  if (rg <= 0 || body <= 0 || body < 0.5 * rg || rg < 0.5 * A || L.c <= Pv.h) return null;
  const low = Math.min(...K.slice(-4).map(k => k.l));
  if (low > e21 + 0.3 * A) return null;
  const r7 = rsi(K, 7);
  if (!(r7 >= 45 && r7 <= 78)) return null;
  const sl = low - 0.15 * A;
  if (!(L.c - sl > 0 && L.c - sl <= 2.2 * A)) return null;
  const { w, fmt: f, sgn: sg } = c;
  let conf = 50 + 12 + (low <= e21 ? 8 : 4) + Math.min(10, (body / rg - 0.5) * 20) + (r7 >= 50 && r7 <= 70 ? 8 : 3);
  const why = [`Fast trend stack: EMA9 ${w.op} EMA21 ${w.op} EMA50 (${w.bull} momentum)`,
    `Pullback: price dipped to the EMA21 (${f(e21)}) within the last 3 candles and held`,
    `Trigger: a ${w.bull} candle with a ${(body / rg * 100).toFixed(0)}% body closed ${w.over} the previous candle's ${w.hi}`,
    `RSI(7) is ${(sg > 0 ? r7 : 100 - r7).toFixed(0)} - room to run, not exhausted`];
  if (swingLevels(K.slice(-150)).some(x => x.type === 'S' && Math.abs(x.price - low) <= 0.7 * A)) {
    conf += 7; why.push(`The pullback also held a swing ${w.sup}`);
  }
  conf = htfAdj(conf, why, htfUp(H), c);
  return mk('SCALPING', 'SC', `${cap(w.bull)} EMA-pullback scalp`, L.c, sl, P.scalp_tp, conf, why,
    `Tight SL ${f(sl)} just beyond the pullback ${w.lo}: if it breaks, the micro-trend has failed`, L.t, low, A, 0.25 * A, P.scalp_expiry);
}

// ----------------------------------------------------------------------- ICT
function ict(K, H, P, c) {
  const n = K.length;
  if (n < 60) return null;
  const A = atr(K);
  if (A <= 0) return null;
  const sw = swings(K, 3), lows = sw.filter(s => s.type === 'L');
  let found = null;
  for (let j = n - 3; j > Math.max(n - 18, 12); j--) {
    const prior = lows.filter(s => s.idx >= j - 40 && s.idx <= j - 2);
    if (!prior.length) continue;
    const pl = prior.at(-1), cj = K[j];
    if (!(cj.l < pl.price - 0.03 * A && cj.c > pl.price)) continue;
    const sweepLow = Math.min(...K.slice(j, j + 3).map(k => k.l));
    const bl = Math.max(...K.slice(pl.idx, j + 1).map(k => k.h));
    let m = null;
    for (let i = j + 1; i < n; i++) if (K[i].c > bl && K[i].c - K[i].o >= P.ict_disp_atr * A) { m = i; break; }
    if (m === null || m < n - 8) continue;
    let broken = false;
    for (let i = j + 1; i < n; i++) if (K[i].c < sweepLow) { broken = true; break; }
    if (broken) continue;
    found = { j, pl, sweepLow, bl, m };
    break;
  }
  if (!found) return null;
  const { j, pl, sweepLow, bl, m } = found;
  const legHi = Math.max(...K.slice(m).map(k => k.h));
  const rng = legHi - sweepLow;
  if (rng < 1.5 * A) return null;
  const zLo = legHi - 0.79 * rng, zHi = legHi - 0.62 * rng, ote = legHi - 0.705 * rng;
  const gaps = [];
  for (let i = j + 1; i < n - 1; i++) if (K[i - 1].h < K[i + 1].l) gaps.push([K[i - 1].h, K[i + 1].l]);
  const ov = gaps.filter(g => g[1] >= zLo && g[0] <= zHi);
  let level, zone, lo, hi;
  if (ov.length) {
    lo = Math.max(ov.at(-1)[0], zLo); hi = Math.min(ov.at(-1)[1], zHi);
    level = (lo + hi) / 2; zone = [lo, hi];
  } else { level = ote; zone = [zLo, zHi]; }
  const sl = sweepLow - 0.15 * A;
  if (!(level - sl >= 0.3 * A && level - sl <= 5 * A) || K[n - 1].c <= sl) return null;
  const { w, fmt: f, sgn: sg } = c;
  let conf = 38 + 15 + 10;
  const why = [`Liquidity grab: price pushed ${w.under} the swing ${w.lo} at ${f(pl.price)} (${w.liq} liquidity) and closed back ${w.over} it - a stop hunt`,
    `Market structure shift: a ${w.bull} displacement candle (${((K[m].c - K[m].o) / A).toFixed(1)} ATR body) closed ${w.over} ${f(bl)}`];
  if (ov.length) {
    conf += 12;
    const [a, b] = sg > 0 ? [lo, hi] : [hi, lo];
    why.push(`Fair value gap ${f(a)} - ${f(b)} overlaps the 62-79% OTE zone; entry at its midpoint ${f(level)}`);
  } else why.push(`No FVG overlap, so entry is the 70.5% OTE retracement of the displacement leg (${f(ote)})`);
  const eq = (Math.max(...K.slice(-60).map(k => k.h)) + Math.min(...K.slice(-60).map(k => k.l))) / 2;
  if (level < eq) { conf += 8; why.push(`Entry is in ${w.cheap} (beyond 50% of the dealing range at ${f(eq)}): buy low / sell high`); }
  if (c.kz) { conf += 6; why.push(`Inside the ${c.kz} killzone - institutional volume window`); }
  conf = htfAdj(conf, why, htfUp(H), c);
  const tgts = sw.filter(s => s.type === 'H' && s.price > level).map(s => s.price);
  let slWhy = `SL ${f(sl)} is beyond the sweep ${w.lo}: if price trades there the liquidity-grab idea is invalid`;
  if (tgts.length) slWhy += `; ${w.liq2} liquidity (target) rests near ${f(Math.min(...tgts))}`;
  return mk('ICT', 'ICT', `${cap(w.bull)} ICT: sweep + MSS + ` + (ov.length ? 'FVG/OTE' : 'OTE'), level, sl, P.ict_tp, conf, why, slWhy,
    K[m].t, K[m].l, A, 0.15 * A, P.ict_expiry, zone);
}

// ------------------------------------------------------------- PRICE ACTION
function pa(K, H, P, c) {
  const n = K.length;
  if (n < 60) return null;
  const A = atr(K), cl = K.map(k => k.c);
  const e20 = ema(cl, 20).at(-1), e50 = ema(cl, 50).at(-1);
  const lv = swingLevels(K.slice(-150)), r14 = rsi(K), hb = htfUp(H);
  const trend = e20 > e50;
  const { w, fmt: f, sgn: sg } = c;
  const L = K[n - 1], Pv = K[n - 2];
  const out = [];

  const finish = (conf, why, needTrend) => {
    if (needTrend && !trend) return null;
    if (trend) { conf += 12; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); }
    else why.push('Trade is counter-trend (EMA20/50) - confidence kept lower');
    if (r14 < 50) { conf += 4; why.push(`RSI ${(sg > 0 ? r14 : 100 - r14).toFixed(0)} leaves room for the move`); }
    return htfAdj(conf, why, hb, c);
  };

  // (a) engulfing at support
  if (Pv.c < Pv.o && L.c > L.o && L.c > Pv.o && L.o <= Pv.c) {
    const bL = L.c - L.o, bP = Pv.o - Pv.c, lowx = Math.min(L.l, Pv.l);
    const sup = lv.find(x => x.type === 'S' && Math.abs(x.price - lowx) <= 0.7 * A);
    if (bL >= bP && bL >= 0.5 * A && (sup || Math.abs(e50 - lowx) <= 0.7 * A)) {
      const level = L.o + 0.5 * bL, sl = lowx - 0.2 * A;
      if (level - sl > 0 && level - sl <= 3 * A) {
        const why = [`${cap(w.bull)} engulfing: the last candle's body (${(bL / A).toFixed(1)} ATR) fully covers the previous one - ${w.buyers} took control`,
          sup ? `It formed on a swing ${w.sup} at ${f(sup.price)}` : 'It formed on the EMA50 dynamic support'];
        const conf = finish(50 + (sup ? 15 : 7) + Math.min(8, (bL / A - 0.5) * 8), why, false);
        if (conf !== null) out.push(mk('PRICE_ACTION', 'PA', `${cap(w.bull)} engulfing at ${w.sup}`, level, sl, P.pa_tp, conf, why,
          `SL ${f(sl)} is beyond the engulfing pattern's ${w.lo}: if it breaks, the pattern failed`, L.t, lowx, A, 0.15 * A, P.pa_expiry));
      }
    }
  }
  // (b) break & retest of a swing high (old resistance -> new support)
  const highs = swings(K, 3).filter(s => s.type === 'H' && s.idx >= n - 45 && s.idx <= n - 8).reverse();
  for (const pv of highs) {
    const R0 = pv.price;
    let k = null;
    for (let i = pv.idx + 1; i < n - 2; i++) if (K[i].c > R0 + 0.1 * A) { k = i; break; }
    if (k === null || K.slice(k + 1).some(x => x.c < R0 - 0.3 * A)) continue;
    if (!(L.l >= R0 - 0.5 * A && L.l <= R0 + 0.25 * A && L.c > R0 && L.c > L.o)) continue;
    const sl = Math.min(L.l, R0 - 0.3 * A) - 0.15 * A;
    if (!(L.c - sl > 0 && L.c - sl <= 2.5 * A)) continue;
    const why = [`Break: price closed ${w.over} the old resistance at ${f(R0)} (swing ${w.hi}), turning it into ${w.sup}`,
      `Retest: price came back to ${f(R0)} and a ${w.bull} candle rejected it, confirming the flip`];
    const conf = finish(55 + (Math.abs(L.l - R0) <= 0.1 * A ? 8 : 3) + 8, why, true);
    if (conf !== null) out.push(mk('PRICE_ACTION', 'PA', `${cap(w.bull)} break & retest`, L.c, sl, P.pa_tp, conf, why,
      `SL ${f(sl)} is ${w.under} the retested level: closing back through it means the break failed`, K[k].t, L.l, A, 0.4 * A, P.pa_expiry,
      [R0 - 0.1 * A, R0 + 0.1 * A]));
    break;
  }
  // (c) inside-bar breakout in trend direction
  const M = K[n - 3], I = K[n - 2];
  if (I.h <= M.h && I.l >= M.l && L.c > M.h && L.c - L.o >= 0.5 * (L.h - L.l) && M.h - M.l >= 0.8 * A) {
    const sl = M.l - 0.1 * A;
    if (L.c - sl > 0 && L.c - sl <= 2.5 * A) {
      const why = [sg > 0 ? `Inside bar: the previous candle stayed inside the mother bar (${f(M.l)}-${f(M.h)}) - compression`
                          : `Inside bar: the previous candle stayed inside the mother bar (${f(M.h)}-${f(M.l)}) - compression`,
        `Breakout: the last candle closed ${w.over} the mother bar's ${w.hi} with a strong body`];
      const conf = finish(52 + 8, why, true);
      if (conf !== null) out.push(mk('PRICE_ACTION', 'PA', `${cap(w.bull)} inside-bar breakout`, L.c, sl, P.pa_tp, conf, why,
        `SL ${f(sl)} is beyond the mother bar's ${w.lo}: the whole compression pattern is invalidated there`, L.t, M.l, A, 0.4 * A, P.pa_expiry));
    }
  }
  let best = null;
  for (const s of out) if (best === null || s.conf > best.conf) best = s;
  return best;
}


// ------------------------------------------------------- SUPPORT & RESISTANCE
// Equal neighbouring swing points (ties) are one touch, not two.
const uniqSwings = arr => arr.filter((x, i) => i === 0 || x.idx - arr[i - 1].idx > 2);
function clusterLevels(pts, tol) {
  const sorted = [...pts].sort((a, b) => a.price - b.price), out = [];
  let cur = null;
  for (const p of sorted) {
    if (cur && p.price - cur.lo <= tol) { cur.hi = p.price; cur.pts.push(p); }
    else { cur = { lo: p.price, hi: p.price, pts: [p] }; out.push(cur); }
  }
  return out.map(z => ({ lo: z.lo, hi: z.hi, touches: z.pts.length, first: Math.min(...z.pts.map(q => q.idx)), last: Math.max(...z.pts.map(q => q.idx)) }));
}
function sr(K, H, P, c) {
  const n = K.length;
  if (n < 80) return null;
  const A = atr(K);
  if (!(A > 0)) return null;
  const off = Math.max(0, n - 150);
  const lows = uniqSwings(swings(K.slice(off), 3).filter(x => x.type === 'L' && x.idx + off <= n - 5).map(x => ({ idx: x.idx + off, price: x.price })));
  const zones = clusterLevels(lows, 0.5 * A).filter(z => z.touches >= 2 && z.last - z.first >= 8);
  const L = K[n - 1], Pv = K[n - 2], rg = L.h - L.l;
  if (rg <= 0 || !zones.length) return null;
  const cl = K.map(k => k.c), e20 = ema(cl, 20).at(-1), e50 = ema(cl, 50).at(-1), r14 = rsi(K);
  const { w, fmt: f, sgn: sg } = c;
  let best = null;
  for (const z of zones) {
    const zLo = z.lo - 0.1 * A, zHi = z.hi + 0.1 * A;
    if (!(L.l <= zHi + 0.1 * A && L.l >= zLo - 0.5 * A)) continue;                 // tapped the zone
    if (!(L.c > L.o && L.c > zHi)) continue;                                         // closed back above it, bullish
    const wick = Math.min(L.o, L.c) - L.l, wickOk = wick >= 0.3 * rg, engulf = Pv.c < Pv.o && L.c > Pv.h;
    if (!wickOk && !engulf) continue;                                                // needs a real rejection
    if (z.touches < 3 && !(wickOk && engulf)) continue;                              // a 2-touch zone needs a perfect rejection
    if (K.slice(-4, -1).some(k => k.c < zLo - 0.3 * A)) continue;                    // zone was just broken
    if (!K.slice(-7, -1).some(k => k.c > zHi + 0.3 * A)) continue;                   // price must have come down to it
    const sl = Math.min(L.l, zLo) - 0.2 * A;
    if (!(L.c - sl > 0.2 * A && L.c - sl <= 3 * A)) continue;
    const why = [`${cap(w.sup)} zone ${f(z.hi)} - ${f(z.lo)} was respected ${z.touches} times before (swing ${w.lo}s clustered together)`,
      wickOk ? `Rejection: a ${(wick / rg * 100).toFixed(0)}% ${w.lo} shadow shows ${w.buyers} defending the zone` : `Rejection: a ${w.bull} candle engulfed the previous one at the zone`];
    if (z.last >= n - 60) why.push('The zone was tested recently, so it is still fresh in the market');
    let conf = 42 + Math.min(16, (z.touches - 2) * 6 + 6) + (wickOk ? Math.min(8, (wick / rg - 0.3) * 20 + 4) : 0) + (engulf ? 5 : 0) + (z.last >= n - 60 ? 3 : 0);
    if (e20 > e50) { conf += 8; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); } else why.push('Trade is against the EMA20/50 trend - lower confidence');
    if (r14 < 50) { conf += 4; why.push(`RSI ${(sg > 0 ? r14 : 100 - r14).toFixed(0)} leaves room for a bounce`); }
    conf = htfAdj(conf, why, htfUp(H), c);
    const hi = swingLevels(K.slice(-150)).filter(x => x.type === 'R' && x.price > L.c).map(x => x.price);
    const setup = mk('SUPPORT_RESISTANCE', 'SR', `${cap(w.bull)} bounce off ${w.sup}`, L.c, sl, P.sr_tp, conf, why,
      `SL ${f(sl)} is beyond the zone: if price closes through it, the ${w.sup} has failed` + (hi.length ? `; the next ${sg > 0 ? 'resistance' : 'support'} (first target area) is near ${f(Math.min(...hi))}` : ''),
      L.t, Math.min(L.l, zLo), A, 0.25 * A, P.sr_expiry, [z.lo, z.hi]);
    if (!best || setup.conf > best.conf) best = setup;
  }
  return best;
}

// ------------------------------------------------------------------ BREAKOUT
function bo(K, H, P, c) {
  const n = K.length;
  if (n < 60) return null;
  const A = atr(K);
  if (!(A > 0)) return null;
  const B = K.slice(-21, -1), L = K[n - 1], Pv = K[n - 2], rg = L.h - L.l;
  const boxHi = Math.max(...B.map(k => k.h)), boxLo = Math.min(...B.map(k => k.l)), ht = boxHi - boxLo;
  if (rg <= 0 || ht < 1.0 * A || ht > 4 * A) return null;                            // a real, but tight, box
  const touches = B.filter(k => k.h >= boxHi - 0.2 * A).length;
  if (touches < 2) return null;                                                      // ceiling tested at least twice
  const body = L.c - L.o;
  if (!(L.c > boxHi + 0.1 * A && L.c - boxHi <= 1.0 * A && Pv.c <= boxHi + 0.05 * A)) return null;   // fresh, not chased
  if (!(body >= 0.55 * rg && rg >= 1.0 * A)) return null;                            // strong expansion candle
  const cl = K.map(k => k.c), e20 = ema(cl, 20).at(-1), e50 = ema(cl, 50).at(-1);
  const sl = Math.max(boxLo, boxHi - 0.9 * A) - 0.1 * A;
  if (!(L.c - sl > 0.3 * A && L.c - sl <= 2.5 * A)) return null;
  const { w, fmt: f, sgn: sg } = c;
  const why = [`Range: the last 20 candles stayed between ${f(sg > 0 ? boxLo : boxHi)} and ${f(sg > 0 ? boxHi : boxLo)} (${(ht / A).toFixed(1)} ATR tall) - the market was coiling`,
    `The range ${sg > 0 ? 'ceiling' : 'floor'} was tested ${touches} times, so ${w.liq2} orders were stacking up behind it`,
    `Breakout: a ${w.bull} candle with a ${(body / rg * 100).toFixed(0)}% body and ${(rg / A).toFixed(1)} ATR range closed ${w.over} the range`];
  let conf = 50 + Math.min(8, (touches - 1) * 4) + Math.min(8, (body / rg - 0.55) * 30 + 3) + Math.min(6, (rg / A - 1) * 6);
  if (e20 > e50) { conf += 8; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); } else why.push('Breakout is against the EMA20/50 trend - lower confidence');
  conf = htfAdj(conf, why, htfUp(H), c);
  return mk('BREAKOUT', 'BO', `${cap(w.bull)} range breakout`, L.c, sl, P.bo_tp, conf, why,
    `SL ${f(sl)} is back inside the range: closing there means the breakout was a fake-out`, L.t, boxLo, A, 0.3 * A, P.bo_expiry, [boxHi - 0.1 * A, boxHi + 0.1 * A]);
}

// ---------------------------------------------------------------- TRENDLINES
function tl(K, H, P, c) {
  const n = K.length;
  if (n < 80) return null;
  const A = atr(K);
  if (!(A > 0)) return null;
  const off = Math.max(0, n - 120), sw = swings(K.slice(off), 3).map(x => ({ ...x, idx: x.idx + off }));
  const lows = uniqSwings(sw.filter(x => x.type === 'L' && x.idx <= n - 5)), highs = uniqSwings(sw.filter(x => x.type === 'H' && x.idx <= n - 5));
  const L = K[n - 1], Pv = K[n - 2], rg = L.h - L.l;
  if (rg <= 0) return null;
  const cl = K.map(k => k.c), e20 = ema(cl, 20).at(-1), e50 = ema(cl, 50).at(-1);
  const { w, fmt: f, sgn: sg } = c;
  const rise = sg > 0 ? 'rising' : 'falling', fall = sg > 0 ? 'falling' : 'rising';
  const out = [];

  // (a) bounce off a rising trendline through two higher swing lows
  outer: for (let bi = lows.length - 1; bi >= Math.max(1, lows.length - 4); bi--) {
    for (let ai = bi - 1; ai >= Math.max(0, bi - 4); ai--) {
      const a = lows[ai], b = lows[bi];
      if (!(a.price < b.price && b.idx - a.idx >= 10)) continue;
      const slope = (b.price - a.price) / (b.idx - a.idx), y = i => a.price + slope * (i - a.idx);
      if (slope * 30 > 5 * A || slope < 0.02 * A) continue;
      if (K.slice(a.idx + 1, n - 1).some((k, j) => k.c < y(a.idx + 1 + j) - 0.25 * A)) continue;   // line must have held
      const yl = y(n - 1);
      if (!(L.l <= yl + 0.25 * A && L.l >= yl - 0.6 * A && L.c > L.o && L.c > yl && K[n - 3].c > y(n - 3))) continue;
      const touches = 2 + lows.filter(x => x.idx > a.idx && x.idx !== b.idx && Math.abs(x.price - y(x.idx)) <= 0.3 * A).length;
      if (touches < 3) continue;                                                       // classic 3-touch line
      const sl = Math.min(L.l, yl) - 0.3 * A;
      if (!(L.c - sl > 0.2 * A && L.c - sl <= 2.5 * A)) continue;
      const why = [`A ${rise} trendline connects the swing ${w.lo}s at ${f(a.price)} and ${f(b.price)} (${touches} touches) and has not been broken since`,
        `Price pulled back to the line (${f(yl)}) and a ${w.bull} candle closed ${w.over} it - the line held again`];
      let conf = 44 + Math.min(12, (touches - 2) * 6 + 6) + (L.c - Math.min(L.o, L.c) >= 0 && Math.min(L.o, L.c) - L.l >= 0.3 * rg ? 6 : 0);
      if (e20 > e50) { conf += 10; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); } else why.push('Trade is against the EMA20/50 trend - lower confidence');
      conf = htfAdj(conf, why, htfUp(H), c);
      out.push(mk('TRENDLINES', 'TL', `${cap(w.bull)} trendline bounce`, L.c, sl, P.tl_tp, conf, why,
        `SL ${f(sl)} is beyond the trendline: a close through it means the line has broken`, L.t, Math.min(L.l, yl), A, 0.25 * A, P.tl_expiry));
      break outer;
    }
  }

  // (b) breakout through a falling trendline through two lower swing highs
  outer2: for (let bi = highs.length - 1; bi >= Math.max(1, highs.length - 4); bi--) {
    for (let ai = bi - 1; ai >= Math.max(0, bi - 4); ai--) {
      const a = highs[ai], b = highs[bi];
      if (!(a.price > b.price && b.idx - a.idx >= 10)) continue;
      const slope = (b.price - a.price) / (b.idx - a.idx), y = i => a.price + slope * (i - a.idx);
      if (-slope * 30 > 5 * A || -slope < 0.02 * A) continue;
      if (K.slice(a.idx + 1, n - 1).some((k, j) => k.c > y(a.idx + 1 + j) + 0.25 * A)) continue;   // line was respected until now
      const yl = y(n - 1);
      if (!(L.c > yl + 0.1 * A && L.c - yl <= 1.0 * A && Pv.c <= y(n - 2) + 0.05 * A && L.c - L.o >= 0.5 * rg && rg >= 0.8 * A)) continue;
      const sl = Math.min(...K.slice(-4).map(k => k.l)) - 0.15 * A;
      if (!(L.c - sl > 0.3 * A && L.c - sl <= 3 * A)) continue;
      const touches = 2 + highs.filter(x => x.idx > a.idx && x.idx !== b.idx && Math.abs(x.price - y(x.idx)) <= 0.3 * A).length;
      if (touches < 3) continue;
      const why = [`A ${fall} trendline connects the swing ${w.hi}s at ${f(a.price)} and ${f(b.price)} (${touches} touches) and capped price until now`,
        `Break: a strong ${w.bull} candle closed ${w.over} the line (${f(yl)}) after the previous candle was still under it`];
      let conf = 46 + Math.min(10, (touches - 2) * 5 + 4) + Math.min(8, (L.c - L.o) / rg * 8);
      if (e20 > e50) { conf += 8; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); } else why.push('A trend change is being attempted (EMA20/50 not yet aligned) - lower confidence');
      conf = htfAdj(conf, why, htfUp(H), c);
      out.push(mk('TRENDLINES', 'TL', `${cap(w.bull)} trendline breakout`, L.c, sl, P.tl_tp, conf, why,
        `SL ${f(sl)} is beyond the recent pullback ${w.lo}: falling back under the line invalidates the break`, L.t, Math.min(L.l, yl), A, 0.3 * A, P.tl_expiry));
      break outer2;
    }
  }
  let best = null;
  for (const x of out) if (best === null || x.conf > best.conf) best = x;
  return best;
}

// ---------------------------------------------------- SMC (smart money concepts)
function smc(K, H, P, c) {
  const n = K.length;
  if (n < 80) return null;
  const A = atr(K);
  if (!(A > 0)) return null;
  const cl = K.map(k => k.c), E20 = ema(cl, 20), E50 = ema(cl, 50), sw = swings(K, 3);
  const highs = sw.filter(x => x.type === 'H' && x.idx >= n - 45 && x.idx <= n - 6).reverse();
  const L = K[n - 1];
  const { w, fmt: f, sgn: sg } = c;
  for (const sh of highs) {
    let i = -1;
    for (let x = sh.idx + 1; x < n - 1; x++) if (K[x].c > sh.price + 0.05 * A) { i = x; break; }
    if (i < 0 || i < n - 30) continue;                                                // break of structure, recent enough
    const jl = sw.filter(x => x.type === 'L' && x.idx < i).at(-1);
    if (!jl) continue;
    let di = -1, dBody = 0;
    for (let x = Math.max(jl.idx, i - 8); x <= i; x++) if (K[x].c - K[x].o > dBody) { dBody = K[x].c - K[x].o; di = x; }
    if (di < 0 || dBody < Math.max(1.2, P.ict_disp_atr) * A) continue;                  // needs strong displacement
    let ob = -1;
    for (let x = di - 1; x >= Math.max(jl.idx, di - 10); x--) if (K[x].c < K[x].o) { ob = x; break; }
    if (ob < 0) continue;                                                              // order block = last opposite candle
    const zLo = K[ob].l, zHi = K[ob].o;
    if (zHi - zLo > 2.5 * A || zHi - zLo <= 0) continue;
    if (K.slice(i + 1).some(k => k.c < zLo)) continue;                                 // block broken -> invalid
    if (K.slice(i + 1, n - 1).some(k => k.l <= zHi)) continue;                         // already mitigated once
    const legHi = Math.max(...K.slice(i).map(k => k.h)), eq = (jl.price + legHi) / 2, level = (zLo + zHi) / 2;
    if (legHi - jl.price < 2.5 * A || !(level < eq) || !(L.c > zLo) || L.c - level > 4 * A) continue;                // must be in discount, price nearby
    const sl = zLo - 0.2 * A;
    if (!(level - sl >= 0.3 * A && level - sl <= 4 * A)) continue;
    let fvg = null;
    for (let x = Math.max(1, di - 1); x <= Math.min(n - 2, i + 1); x++) if (K[x - 1].h < K[x + 1].l) fvg = [K[x - 1].h, K[x + 1].l];
    const choch = E20[ob] < E50[ob];
    const obWord = sg > 0 ? 'bearish' : 'bullish';
    const why = [choch ? `Change of character: price closed ${w.over} the swing ${w.hi} at ${f(sh.price)} while the trend was still ${sg > 0 ? 'down' : 'up'} - the first sign smart money flipped`
                       : `Break of structure: price closed ${w.over} the swing ${w.hi} at ${f(sh.price)} - the ${w.bull} trend continues`,
      `Displacement: a ${(dBody / A).toFixed(1)} ATR ${w.bull} candle drove the break, so this was institutional buying, not noise`,
      `Order block: the last ${obWord} candle before the move (${f(sg > 0 ? zLo : zHi)} - ${f(sg > 0 ? zHi : zLo)}) is where those orders were placed; entry at its midpoint ${f(level)}`,
      `Discount: the block sits ${w.under} the 50% line (${f(eq)}) of the leg, so you ${sg > 0 ? 'buy cheap' : 'sell expensive'}`];
    let conf = 34 + 14 + Math.min(8, (dBody / A - 1.2) * 8 + 3) + 10 + (choch ? 0 : 6);
    if (fvg) { conf += 8; why.push('A fair value gap (imbalance) was left inside the move, which adds weight to the block'); }
    if (c.kz) { conf += 6; why.push(`Inside the ${c.kz} killzone - institutional volume window`); }
    conf = htfAdj(conf, why, htfUp(H), c);
    return mk('SMC', 'SM', `${cap(w.bull)} SMC: ${choch ? 'CHoCH' : 'BOS'} + order block`, level, sl, P.smc_tp, conf, why,
      `SL ${f(sl)} is beyond the order block: a close through it means the block failed`, K[i].t, zLo, A, 0.15 * A, P.smc_expiry, [zLo, zHi]);
  }
  return null;
}


// --------------------------------------------------------- MIDPOINT STRATEGY
// Trades the 50% midpoint: (a) of a strong impulse candle, (b) of the last swing leg. Price returns to it and holds.
function mid(K, H, P, c) {
  const n = K.length;
  if (n < 60) return null;
  const A = atr(K);
  if (!(A > 0)) return null;
  const L = K[n - 1], Pv = K[n - 2], rg = L.h - L.l;
  if (rg <= 0) return null;
  const cl = K.map(k => k.c), e20 = ema(cl, 20).at(-1), e50 = ema(cl, 50).at(-1), r14 = rsi(K);
  const { w, fmt: f, sgn: sg } = c;
  const out = [];
  const bounce = (m) => L.l <= m + 0.15 * A && L.l >= m - 0.5 * A && L.c > L.o && L.c > m;   // tapped the midpoint, closed back above it

  // (a) midpoint of a strong impulse candle
  for (let j = n - 3; j >= n - 12; j--) {
    const I = K[j], body = I.c - I.o, irg = I.h - I.l;
    if (!(body >= 1.4 * A && body >= 0.6 * irg)) continue;
    const m = I.o + body / 2;
    if (!bounce(m)) continue;
    if (K.slice(j + 1, n).some(k => k.c < m - 0.25 * A) || K.slice(j + 1, n).some(k => k.c < I.l)) continue;   // midpoint must have held
    if (!K.slice(j + 1, n - 1).some(k => k.h > m + 0.5 * A) && j < n - 3) { /* price drifted along the midpoint: still valid */ }
    const sl = Math.min(L.l, m) - 0.4 * A;
    if (!(L.c - sl > 0.2 * A && L.c - sl <= 3 * A)) continue;
    const wick = Math.min(L.o, L.c) - L.l;
    const why = [`Impulse: a strong ${w.bull} candle (${(body / A).toFixed(1)} ATR body) at ${f(I.o)} - ${f(I.c)} shows ${w.buyers} in control`,
      `Midpoint: price has pulled back to the 50% level of that candle (${f(m)}) - the point where the move is considered fair value`,
      `Hold: the last candle tapped ${f(m)} and closed ${w.over} it${wick >= 0.3 * rg ? ` with a ${(wick / rg * 100).toFixed(0)}% ${w.lo} shadow` : ''}; no candle since the impulse closed meaningfully ${w.under} the midpoint`];
    let conf = 50 + Math.min(10, (body / A - 1.4) * 8 + 3) + (wick >= 0.3 * rg ? 6 : 0) + (j >= n - 6 ? 4 : 0);
    if (e20 > e50) { conf += 8; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); } else why.push('Trade is against the EMA20/50 trend - lower confidence');
    if (r14 < 55) { conf += 3; why.push(`RSI ${(sg > 0 ? r14 : 100 - r14).toFixed(0)} leaves room to run`); }
    conf = htfAdj(conf, why, htfUp(H), c);
    out.push(mk('MIDPOINT', 'MP', `${cap(w.bull)} impulse-candle midpoint hold`, L.c, sl, P.mid_tp, conf, why,
      `SL ${f(sl)} is beyond the midpoint: closing through the 50% level means the impulse has been rejected` + `; the impulse ${w.hi} at ${f(I.h)} is the first target area`,
      I.t, Math.min(L.l, m), A, 0.25 * A, P.mid_expiry, [m - 0.1 * A, m + 0.1 * A]));
    break;
  }

  // (b) midpoint of the last up-leg (swing low -> swing high)
  const sw = swings(K, 3), highs = sw.filter(x => x.type === 'H' && x.idx >= n - 40 && x.idx <= n - 4).reverse();
  for (const sh of highs) {
    const jl = sw.filter(x => x.type === 'L' && x.idx < sh.idx).at(-1);
    if (!jl || sh.price - jl.price < 2.5 * A) continue;
    const m = (jl.price + sh.price) / 2;
    if (!bounce(m)) continue;
    if (K.slice(sh.idx + 1).some(k => k.c < jl.price || k.c < m - 0.3 * A)) continue;       // leg intact, midpoint held
    if (K.slice(sh.idx + 1, n - 1).some(k => k.l <= m + 0.15 * A)) continue;                // first touch only
    const sl = Math.max(jl.price, m - 1.5 * A) - 0.15 * A;
    if (!(L.c - sl > 0.3 * A && L.c - sl <= 3 * A)) continue;
    const why = [`Leg: price travelled from the swing ${w.lo} ${f(jl.price)} to the swing ${w.hi} ${f(sh.price)} (${((sh.price - jl.price) / A).toFixed(1)} ATR)`,
      `Midpoint: the 50% level of that leg is ${f(m)} - the equilibrium where ${w.buyers} tend to re-enter`,
      `First touch: price returned to ${f(m)} for the first time and a ${w.bull} candle closed ${w.over} it`];
    let conf = 48 + Math.min(10, ((sh.price - jl.price) / A - 2.5) * 3 + 3) + (sh.idx >= n - 20 ? 4 : 0);
    if (e20 > e50) { conf += 10; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); } else why.push('Trade is against the EMA20/50 trend - lower confidence');
    conf = htfAdj(conf, why, htfUp(H), c);
    out.push(mk('MIDPOINT', 'MP', `${cap(w.bull)} 50% leg midpoint`, L.c, sl, P.mid_tp, conf, why,
      `SL ${f(sl)} is beyond the midpoint zone: a close through it means the pullback is turning into a reversal`,
      sh.t, Math.min(L.l, m), A, 0.25 * A, P.mid_expiry, [m - 0.1 * A, m + 0.1 * A]));
    break;
  }
  let best = null;
  for (const x of out) if (best === null || x.conf > best.conf) best = x;
  return best;
}


// ------------------------------------------------------ AGGRESSIVE SCALPING
// Faster and looser than Scalping: EMA 5/13/34 stack, micro-breakout of the last 3 candles, quick targets.
function ascalp(K, H, P, c) {
  const n = K.length;
  if (n < 50) return null;
  const A = atr(K), cl = K.map(k => k.c);
  if (!(A > 0)) return null;
  const e5 = ema(cl, 5).at(-1), e13 = ema(cl, 13).at(-1), e34 = ema(cl, 34).at(-1);
  if (!(e5 > e13 && e13 > e34)) return null;
  const L = K[n - 1], Pv = K[n - 2], rg = L.h - L.l, body = L.c - L.o;
  if (rg <= 0 || body <= 0 || body < 0.55 * rg || rg < 0.7 * A) return null;
  const hh = Math.max(...K.slice(-4, -1).map(k => k.h));
  if (L.c <= hh) return null;                                                        // must break the last 3 candles' high
  if (L.c - e5 > 1.2 * A) return null;                                               // not already stretched
  const r5 = rsi(K, 5);
  if (!(r5 >= 52 && r5 <= 88)) return null;
  const low = Math.min(L.l, Pv.l), sl = low - 0.1 * A;
  if (!(L.c - sl > 0.2 * A && L.c - sl <= 1.6 * A)) return null;
  const { w, fmt: f, sgn: sg } = c;
  const why = [`Fast trend stack: EMA5 ${w.op} EMA13 ${w.op} EMA34 - short-term ${w.bull} momentum`,
    `Burst: a ${w.bull} candle (${(body / rg * 100).toFixed(0)}% body, ${(rg / A).toFixed(1)} ATR range) closed ${w.over} the ${w.hi} of the previous 3 candles at ${f(hh)}`,
    `Not chasing: the close is only ${((L.c - e5) / A).toFixed(1)} ATR from the EMA5`,
    `RSI(5) is ${(sg > 0 ? r5 : 100 - r5).toFixed(0)} - momentum is on${r5 > 78 ? ' but getting hot, so take profits quickly' : ''}`];
  let conf = 46 + 10 + Math.min(10, (body / rg - 0.55) * 25) + Math.min(8, (rg / A - 0.7) * 8) + (r5 <= 78 ? 6 : 2);
  conf = htfAdj(conf, why, htfUp(H), c);
  return mk('AGGRESSIVE_SCALPING', 'AS', `${cap(w.bull)} aggressive scalp`, L.c, sl, P.as_tp, conf, why,
    `Very tight SL ${f(sl)} beyond the last two candles' ${w.lo}: if the burst reverses, the scalp is wrong. Take TP1 fast`, L.t, low, A, 0.2 * A, P.as_expiry);
}

// ---------------------------------------------------------------- ZONE TO ZONE
// Buy a demand zone and target the next supply zone (sell mirrored). Targets sit at the opposite zone, not at fixed R.
function z2z(K, H, P, c) {
  const n = K.length;
  if (n < 80) return null;
  const A = atr(K);
  if (!(A > 0)) return null;
  const off = Math.max(0, n - 150), sw = swings(K.slice(off), 3).map(x => ({ ...x, idx: x.idx + off }));
  const pts = t => uniqSwings(sw.filter(x => x.type === t && x.idx <= n - 5)).map(x => ({ idx: x.idx, price: x.price }));
  const dem = clusterLevels(pts('L'), 0.5 * A).filter(z => z.touches >= 2 && z.last - z.first >= 8);
  const sup = clusterLevels(pts('H'), 0.5 * A).filter(z => z.touches >= 2 && z.last - z.first >= 8);
  const L = K[n - 1], Pv = K[n - 2], rg = L.h - L.l;
  if (rg <= 0 || !dem.length || !sup.length) return null;
  const cl = K.map(k => k.c), e20 = ema(cl, 20).at(-1), e50 = ema(cl, 50).at(-1);
  const { w, fmt: f, sgn: sg } = c;
  let best = null;
  for (const z of dem) {
    const zLo = z.lo - 0.1 * A, zHi = z.hi + 0.1 * A;
    if (!(L.l <= zHi + 0.1 * A && L.l >= zLo - 0.5 * A && L.c > L.o && L.c > zHi)) continue;
    const wick = Math.min(L.o, L.c) - L.l, wickOk = wick >= 0.3 * rg, engulf = Pv.c < Pv.o && L.c > Pv.h;
    if (!wickOk && !engulf) continue;
    if (z.touches < 3 && !(wickOk && engulf)) continue;                              // a 2-touch zone needs a perfect rejection
    if (K.slice(-4, -1).some(k => k.c < zLo - 0.3 * A)) continue;
    if (!K.slice(-7, -1).some(k => k.c > zHi + 0.3 * A)) continue;
    const tz = sup.filter(s2 => s2.lo > L.c + 2 * A).sort((a, b) => a.lo - b.lo)[0];  // the next zone above
    if (!tz) continue;
    const sl = Math.min(L.l, zLo) - 0.2 * A, r = L.c - sl;
    if (!(r > 0.2 * A && r <= 3 * A)) continue;
    const d2 = tz.lo - L.c, rr = d2 / r;
    if (rr < 1.5) continue;                                                           // not worth the trip
    const tp3 = tz.lo + Math.max(0.3 * A, tz.hi - tz.lo);
    const mults = [0.5 * d2 / r, rr, (tp3 - L.c) / r];
    const why = [`Zone map: ${w.sup} zone ${f(z.hi)} - ${f(z.lo)} (${z.touches} touches) below, next ${sg > 0 ? 'supply' : 'demand'} zone ${f(sg > 0 ? tz.lo : tz.hi)} - ${f(sg > 0 ? tz.hi : tz.lo)} (${tz.touches} touches) above, ${(d2 / A).toFixed(1)} ATR away`,
      wickOk ? `Rejection at the start zone: a ${(wick / rg * 100).toFixed(0)}% ${w.lo} shadow shows ${w.buyers} defending it` : `Rejection at the start zone: a ${w.bull} candle engulfed the previous one`,
      `Trip is worth it: reaching the front of the next zone pays ${rr.toFixed(1)}R against the stop`];
    let conf = 44 + Math.min(12, (z.touches - 2) * 5 + 4) + Math.min(6, (tz.touches - 2) * 3 + 3) + (wickOk ? Math.min(8, (wick / rg - 0.3) * 20 + 4) : 0) + (engulf ? 5 : 0) + (rr >= 3 ? 10 : rr >= 2 ? 6 : 3);
    if (e20 > e50) { conf += 6; why.push(`Trend agrees: EMA20 ${w.op} EMA50`); } else why.push('Trade is against the EMA20/50 trend - lower confidence');
    conf = htfAdj(conf, why, htfUp(H), c);
    const setup = mk('ZONE_TO_ZONE', 'ZZ', `${cap(w.bull)} zone-to-zone`, L.c, sl, mults, conf, why,
      `SL ${f(sl)} is beyond the start zone. TP1 is halfway to the next zone, TP2 at its front edge (${f(tz.lo)}), TP3 at its far side`,
      L.t, Math.min(L.l, zLo), A, 0.25 * A, P.zz_expiry, [z.lo, z.hi]);
    if (!best || setup.conf > best.conf) best = setup;
  }
  return best;
}

// -------------------------------------------------------------- MEAN REVERSION
// Bollinger(20, 2): a close outside the band in a ranging market, then a bullish close back inside. Targets the mean.
function bbAt(K, i, n = 20) {
  let sum = 0;
  for (let x = i - n + 1; x <= i; x++) sum += K[x].c;
  const m = sum / n; let v = 0;
  for (let x = i - n + 1; x <= i; x++) v += (K[x].c - m) ** 2;
  return { m, sd: Math.sqrt(v / n) };
}
function meanrev(K, H, P, c) {
  const n = K.length;
  if (n < 60) return null;
  const A = atr(K);
  if (!(A > 0)) return null;
  const L = K[n - 1], rg = L.h - L.l;
  if (rg <= 0) return null;
  const bL = bbAt(K, n - 1), lowerL = bL.m - 2 * bL.sd;
  const win = K.slice(-31); let path = 0;
  for (let i = 1; i < win.length; i++) path += Math.abs(win[i].c - win[i - 1].c);
  const er = path > 0 ? Math.abs(win.at(-1).c - win[0].c) / path : 0;
  if (er > 0.35) return null;                                                        // trending: do not fade it
  if (bL.sd * 4 < 1.0 * A) return null;                                              // bands too tight to be worth it
  let st = -1;
  for (let i = n - 2; i >= n - 4; i--) { const b = bbAt(K, i); if (K[i].c < b.m - 2 * b.sd) { st = i; break; } }
  if (st < 0) return null;
  if (!(L.c > lowerL && L.c < bL.m && L.c > L.o)) return null;                       // back inside, bullish, still below the mean
  const rs = rsi(K.slice(0, st + 1));
  if (rs > 35) return null;
  const low = Math.min(...K.slice(st).map(k => k.l)), sl = low - 0.2 * A, r = L.c - sl;
  if (!(r > 0.3 * A && r <= 2.5 * A)) return null;
  const d1 = bL.m - L.c, d2 = bL.m + bL.sd - L.c, d3 = bL.m + 1.5 * bL.sd - L.c;
  if (d1 / r < 0.8) return null;                                                     // not enough room back to the mean
  const { w, fmt: f, sgn: sg } = c, wick = Math.min(L.o, L.c) - L.l;
  const b2 = bbAt(K, st), depth = (b2.m - 2 * b2.sd) - K[st].c;
  const why = [`Stretch: a candle closed ${w.under} the lower Bollinger band (20, 2) - price was ${(depth / A).toFixed(1)} ATR beyond it`,
    `RSI was ${(sg > 0 ? rs : 100 - rs).toFixed(0)} at the extreme - ${w.sellers} exhausted`,
    `Snap-back: the last candle is ${w.bull} and closed back inside the band at ${f(L.c)}, still ${(d1 / A).toFixed(1)} ATR from the mean ${f(bL.m)}`,
    `Ranging market: efficiency ratio ${er.toFixed(2)} (below 0.35), so fading the stretch is reasonable`];
  let conf = 46 + Math.min(10, (depth / A) * 6) + (rs < 30 ? 8 : 4) + (wick >= 0.3 * rg ? 6 : 0) + (er < 0.2 ? 6 : 0);
  conf = htfAdj(conf, why, htfUp(H), c);
  return mk('MEAN_REVERSION', 'MR', `${cap(w.bull)} mean reversion`, L.c, sl, [d1 / r, d2 / r, d3 / r], conf, why,
    `SL ${f(sl)} is beyond the stretch extreme: if price keeps going, it is a trend, not a stretch. TP1 = the mean (${f(bL.m)}), TP2 = mean + 1 deviation, TP3 = mean + 1.5`,
    K[st].t, low, A, 0.25 * A, P.mr_expiry);
}


// 714 Method pip sizes. Forex: 0.0001 (0.01 for JPY pairs). Metals/energies: working defaults, broker-specific.
const PIP_714 = { XAUUSD: 0.1, XAGUSD: 0.01, XPTUSD: 0.1, XPDUSD: 0.1 };
function pipSize714(meta, P) {
  const name = String(meta.name || '').toUpperCase(), code = String(meta.code || '').toUpperCase();
  const ov = P && P.pips ? Number(P.pips[name] ?? P.pips[code]) : 0;
  if (ov > 0) return ov;
  if (meta.category === 'Forex') return /JPY/.test(name) ? 0.01 : 0.0001;
  if (meta.category === 'Metals') return PIP_714[name] || 0;
  if (meta.category === 'Energies') return 0.01;
  return 0;
}

// 714 Method (user-defined): use SAST (UTC+2) hourly direction, then M5 pullback + continuation.
function detect714(K, P, ctx, meta, now) {
  if (!K || K.length < 100) return null;
  const last = K.at(-1);
  // Determine today's SAST clock from the candle's UTC epoch; no device timezone assumptions.
  const local = new Date(last.t * 1000 + 2 * 60 * 60 * 1000);
  const closeHour = local.getUTCHours();
  const starts = closeHour >= 8 && closeHour < 9 ? 7
    : closeHour >= 14 && closeHour < 15 ? 13
    : closeHour >= 17 && closeHour < 18 ? 16 : null;
  if (starts === null) return null;
  const boundaryHour = starts + 1;
  const boundary = Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate(), boundaryHour - 2, 0, 0) / 1000;
  if (last.t < boundary || last.t >= boundary + 3600) return null;
  // The reference candles are 07:00–08:00, 13:00–14:00 and 16:00–17:00 SAST.
  const sessionStart = boundary - 3600;
  const hourBars = K.filter(k => k.t >= sessionStart && k.t < boundary);
  if (hourBars.length < 10) return null;
  const hourOpen = hourBars[0].o, hourClose = hourBars.at(-1).c;
  if (hourOpen === hourClose) return null;
  const dir = hourClose > hourOpen ? 1 : -1;
  const post = K.filter(k => k.t >= boundary && k.t <= last.t);
  if (post.length < 3 || post.length > 12) return null;
  // Require at least one countertrend candle in the pullback, then a close in the hourly direction.
  const trigger = post.at(-1), prior = post.slice(0, -1);
  const hasPullback = dir > 0 ? prior.some(k => k.c < k.o) : prior.some(k => k.c > k.o);
  const continuation = dir > 0 ? trigger.c > trigger.o && trigger.c > prior.at(-1).h
                                : trigger.c < trigger.o && trigger.c < prior.at(-1).l;
  if (!hasPullback || !continuation) return null;
  const A = analyze(K).atr;
  if (!Number.isFinite(A) || A <= 0) return null;
  const recent = K.slice(-8, -1);
  const swing = dir > 0 ? Math.min(...recent.map(k => k.l)) : Math.max(...recent.map(k => k.h));
  const entry = trigger.c;
  // Pip size per instrument. Display precision is NOT used (it made Silver's target 5.0 and Bitcoin's 0.5).
  // Unknown markets (crypto, indices, synthetics, other metals) are skipped until you set a pip size in Settings.
  const pip = pipSize714(meta, P);
  if (!(pip > 0)) return null;
  const targetDist = 50 * pip;
  const sl = dir > 0 ? swing - pip : swing + pip;
  if ((dir > 0 && sl >= entry) || (dir < 0 && sl <= entry)) return null;
  const conf = Math.min(90, 65 + (Math.abs(hourClose - hourOpen) >= A * 0.5 ? 8 : 0));
  if (conf < P.min_conf) return null;
  return {
    strategy: '714_METHOD', code: `714-${starts}`, title: `714 ${dir > 0 ? 'bullish' : 'bearish'} pullback continuation`,
    dir, level: entry, sl, mults: P.tp, conf,
    reasons: [
      `The ${String(starts).padStart(2,'0')}:00–${String(closeHour).padStart(2,'0')}:00 SAST reference hour closed ${dir > 0 ? 'bullish' : 'bearish'}`,
      'An M5 countertrend pullback was observed after the reference hour closed',
      'The latest M5 candle confirmed continuation by closing beyond the previous candle in the hourly direction',
      'Take-profit target is fixed at 50 instrument pips; pip size depends on symbol digits and broker convention'
    ],
    sl_why: 'Stop-loss is placed beyond the recent M5 pullback swing, with a one-pip buffer',
    t: trigger.t, ext: swing, atr: A, tol: A * 0.05, expiry: 3, zone: [],
    fixedTargetDistance: targetDist
  };
}

const STRATEGIES = { SCALPING: scalp, ICT: ict, PRICE_ACTION: pa, SUPPORT_RESISTANCE: sr, BREAKOUT: bo, TRENDLINES: tl, SMC: smc, MIDPOINT: mid, AGGRESSIVE_SCALPING: ascalp, ZONE_TO_ZONE: z2z, MEAN_REVERSION: meanrev };

// Every BUY / SELL setup a strategy finds on closed candles K (H = higher-timeframe candles or null).
function detectAll(name, K, H, P, ctx) {
  const fn = STRATEGIES[name], found = [];
  for (const d of [1, -1]) {
    const c = { ...ctx, sgn: d, w: WORDS[String(d)], fmt: v => (d * v).toFixed(ctx.digits) };
    const s = fn(d > 0 ? K : mirror(K), H ? (d > 0 ? H : mirror(H)) : null, P, c);
    if (!s || s.conf < P.min_conf) continue;
    s.dir = d;
    if (d < 0) { s.level = -s.level; s.sl = -s.sl; s.ext = -s.ext; s.zone = [...s.zone].reverse().map(z => -z); }
    found.push(s);
  }
  return found;
}

// Highest-confidence setup (BUY or SELL), or null.
function detect(name, K, H, P, ctx) {
  let best = null;
  for (const s of detectAll(name, K, H, P, ctx)) if (best === null || s.conf > best.conf) best = s;
  return best;
}

// ---- news.js
// High-impact news: currency mapping + calendar (free weekly feed, cached on the phone, plus manual events).
const FF_URL = 'https://nfs.faireconomy.media/ff_calendar_thisweek.json';

// Which currencies' news moves this instrument ([] = news-immune, e.g. synthetic indices).
function currencies(meta) {
  if (Array.isArray(meta.ccy)) return meta.ccy.map(c => c.toUpperCase());
  const cat = meta.category, n = (meta.name || '').toUpperCase();
  if (cat === 'Synthetics' || cat === 'Headway') return [];
  if (cat === 'Forex') {
    const code = (meta.code || '').replace(/^frx/, '').toUpperCase();
    const p = code.length === 6 ? code : n;
    return [p.slice(0, 3), p.slice(3, 6)];
  }
  if (cat === 'Indices') {
    if (/UK|FTSE|GBP/.test(n)) return ['GBP'];
    if (/GER|DAX|DE40|EURO|FRANCE|CAC|EU50|SPAIN|NETH/.test(n)) return ['EUR'];
    if (/JP|NIKKEI/.test(n)) return ['JPY'];
    if (/AUS/.test(n)) return ['AUD'];
    return ['USD'];
  }
  return ['USD'];
}

function parseCalendar(items, impacts = ['high']) {
  const out = [];
  for (const it of items || []) {
    try {
      if (!impacts.includes(String(it.impact || '').toLowerCase())) continue;
      const ts = new Date(it.date).getTime() / 1000;
      if (!Number.isFinite(ts)) continue;
      out.push({ title: it.title, ccy: String(it.country).toUpperCase(), ts, forecast: it.forecast || '', previous: it.previous || '' });
    } catch (e) { /* skip malformed row */ }
  }
  return out;
}

class Calendar {
  constructor({ storage = null, fetchImpl = null, clock = () => Date.now() / 1000, url = FF_URL, ttl = 7200 } = {}) {
    this.storage = storage; this.fetchImpl = fetchImpl || ((...a) => globalThis.fetch(...a)); this.clock = clock; this.url = url; this.ttl = ttl;
    this.enabled = true; this.events = []; this.manual = []; this.fetched = 0; this.loading = false;
    this.status = 'not loaded'; this.nextId = 1;
    const load = k => { try { return JSON.parse(storage?.getItem(k) || 'null'); } catch (e) { return null; } };
    this.manual = load('acs_news_manual') || [];
    this.nextId = this.manual.reduce((m, e) => Math.max(m, e.id || 0), 0) + 1;
    const cache = load('acs_news_cache');
    if (cache) { this.events = parseCalendar(cache); this.status = 'cached calendar'; }
  }
  _saveManual() { try { this.storage?.setItem('acs_news_manual', JSON.stringify(this.manual)); } catch (e) { /* ignore */ } }
  addManual(title, ccy, ts) {
    const e = { id: this.nextId++, title, ccy: ccy.toUpperCase(), ts, forecast: '', previous: '', manual: true };
    this.manual.push(e); this._saveManual(); return e;
  }
  removeManual(id) { this.manual = this.manual.filter(e => e.id !== id); this._saveManual(); }
  async refresh(force = false) {
    if (!this.enabled || this.loading) return;
    if (!force && this.clock() - this.fetched < this.ttl) return;
    this.fetched = this.clock(); this.loading = true;
    try {
      const r = await this.fetchImpl(this.url, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      this.events = parseCalendar(data);
      try { this.storage?.setItem('acs_news_cache', JSON.stringify(data)); } catch (e) { /* ignore */ }
      this.status = `live calendar (${this.events.length} high-impact events this week)`;
    } catch (e) {
      this.status = this.events.length ? 'using cached calendar (live fetch failed)' : 'calendar unavailable - add events manually';
    } finally { this.loading = false; }
  }
  all() { return [...this.events, ...this.manual].sort((a, b) => a.ts - b.ts); }
}

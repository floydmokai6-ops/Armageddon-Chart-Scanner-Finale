// ----------------------------------------------------------------- Deriv (live)
class DerivFeed {
  constructor({ endpoints = DERIV_ENDPOINTS, appId = 1089,
                WS = globalThis.WebSocket, clock = () => Date.now(), heartbeat = 30000, connectTimeout = 8000, retryBase = 2000, gap = 80 } = {}) {
    Object.assign(this, { endpoints, appId, WS, clock, heartbeat, connectTimeout, retryBase, gap });
    this.ws = null; this.reqId = 0; this.pending = new Map(); this.store = new Map(); this.htfStore = new Map();
    this.metas = []; this.skipped = []; this.active = []; this.tf = 'M5'; this.state = 'idle'; this.msg = '';
    this.lastMsg = 0; this.stopping = false; this.hb = null; this.listeners = new Set();
  }
  onStatus(fn) { this.listeners.add(fn); }
  _status(state, msg = '') { this.state = state; this.msg = msg; this.listeners.forEach(f => f(this.status())); }
  status() { return { state: this.state, msg: this.msg, ready: this.metas.filter(m => this.store.has(`${m.code}|${this.tf}`)).length, total: this.metas.length, lastMsg: this.lastMsg }; }

  _openOne(url) {
    return new Promise((resolve, reject) => {
      let done = false, ws;
      const fail = e => { if (!done) { done = true; try { ws && ws.close(); } catch (x) { /* ignore */ } reject(e); } };
      const timer = setTimeout(() => fail(new Error('timeout')), this.connectTimeout);
      try { ws = new this.WS(url); } catch (e) { clearTimeout(timer); return fail(e); }
      ws.onopen = () => { if (!done) { done = true; clearTimeout(timer); resolve(ws); } };
      ws.onerror = () => { clearTimeout(timer); fail(new Error('connection error')); };
      ws.onclose = () => { clearTimeout(timer); fail(new Error('closed')); };
    });
  }
  async _open() {
    const tried = [];
    for (const ep of this.endpoints) {
      const url = ep.replace('{app}', this.appId);
      try {
        const ws = await this._openOne(url);
        ws.onmessage = ev => this._onMsg(ev);
        ws.onerror = () => {};
        ws.onclose = () => this._onClose(ws);
        this.ws = ws; this.connectedTo = url;
        clearInterval(this.hb);
        if (this.heartbeat) this.hb = setInterval(() => { try { this.ws && this.ws.readyState === 1 && this.ws.send(JSON.stringify({ ping: 1 })); } catch (e) { /* ignore */ } }, this.heartbeat);
        return ep;
      } catch (e) { let host = url; try { host = new URL(url.replace(/^wss:/, 'https:')).host; } catch (x) { /* keep url */ } tried.push(`${host}: ${e.message}`); }
    }
    this.tried = tried;
    throw new Error(`Could not reach the market-data servers (${tried.join('; ')}). Check your internet connection, try Wi-Fi or mobile data, then tap Retry.`);
  }
  _send(obj, timeout = 15000) {
    return new Promise((resolve, reject) => {
      if (!this.ws || this.ws.readyState !== 1) return reject(new Error('not connected'));
      const id = ++this.reqId;
      const timer = setTimeout(() => { this.pending.delete(id); reject(new Error('request timed out')); }, timeout);
      this.pending.set(id, { resolve, reject, timer });
      this.ws.send(JSON.stringify({ ...obj, req_id: id }));
    });
  }
  _onMsg(ev) {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    this.lastMsg = this.clock();
    const p = d.req_id && this.pending.get(d.req_id);
    if (p) {
      this.pending.delete(d.req_id); clearTimeout(p.timer);
      if (d.error) p.reject(new Error(d.error.message || d.error.code || 'API error')); else p.resolve(d);
    }
    if (d.msg_type === 'ohlc' && d.ohlc) this._ohlc(d.ohlc);
  }
  _ohlc(o) {
    const tf = TF_BY_GRAN[+o.granularity];
    if (!tf) return;
    const arr = this.store.get(`${o.symbol || o.underlying_symbol}|${tf}`);
    if (!arr) return;
    const t = +o.open_time, k = { t, o: +o.open, h: +o.high, l: +o.low, c: +o.close }, last = arr[arr.length - 1];
    if (last && last.t === t) { last.o = k.o; last.h = k.h; last.l = k.l; last.c = k.c; }
    else if (!last || t > last.t) { arr.push(k); if (arr.length > 400) arr.shift(); }
  }
  _onClose(ws) {
    if (this.stopping || ws !== this.ws) return;
    this.pending.forEach(p => { clearTimeout(p.timer); p.reject(new Error('connection lost')); }); this.pending.clear();
    this._status('reconnecting', 'Connection lost - reconnecting...');
    this._reconnect();
  }
  async _reconnect() {
    let wait = this.retryBase;
    while (!this.stopping) {
      try {
        await this._open();
        await this._subscribeAll();
        this._status('live', '');
        return;
      } catch (e) { this._status('reconnecting', e.message); await sleep(wait); wait = Math.min(wait * 2, 30000); }
    }
  }
  async _loadActive() {
    try {
      const r = await this._send({ active_symbols: 'brief' });
      this.active = (r.active_symbols || []).map(a => {
        const code = a.symbol || a.underlying_symbol || a.underlying || '', market = a.market || a.market_type || '';
        return { code, label: a.display_name || a.underlying_symbol_name || a.symbol_name || code, market, category: MARKET_CATEGORY[market] || 'Other',
          open: a.exchange_is_open === undefined ? true : !!a.exchange_is_open && !a.is_trading_suspended };
      }).filter(a => a.code);
    } catch (e) { this.active = []; }
  }
  async _loadCandles(meta, tf, subscribe) {
    const r = await this._send({ ticks_history: meta.code, adjust_start_time: 1, count: 300, end: 'latest',
      granularity: GRAN[tf], style: 'candles', ...(subscribe ? { subscribe: 1 } : {}) });
    const arr = (r.candles || []).map(c => ({ t: +c.epoch, o: +c.open, h: +c.high, l: +c.low, c: +c.close }));
    if (r.pip_size !== undefined) meta.digits = +r.pip_size;
    return arr;
  }
  async _subscribeAll() {
    for (const m of this.metas) {
      try { this.store.set(`${m.code}|${this.tf}`, await this._loadCandles(m, this.tf, true)); m.error = ''; }
      catch (e) { m.error = e.message; }
      if (this.gap) await sleep(this.gap);
    }
  }
  // metas: [{code, name, category}] -> returns the instruments that are really available
  async start(metas, tf = 'M5') {
    this.stopping = false; this.tf = tf; this._status('connecting', 'Connecting to live market data...');
    await this._open();
    await this._loadActive();
    const have = new Set(this.active.map(a => a.code));
    const validate = have.size > 0 && metas.some(m => have.has(m.code));   // only trust the list if it uses the codes we know
    this.skipped = validate ? metas.filter(m => !have.has(m.code)) : [];
    this.metas = metas.filter(m => !validate || have.has(m.code)).map(m => ({ ...m, digits: m.digits ?? 2 }));
    await this._subscribeAll();
    const ok = this.metas.filter(m => this.store.has(`${m.code}|${tf}`));
    if (!ok.length) { this._status('error', 'Connected, but no price data was returned.'); throw new Error('no data'); }
    this._status('live', '');
    return this.metas.filter(m => this.store.has(`${m.code}|${tf}`));
  }
  async setTimeframe(tf) {
    if (tf === this.tf) return;
    this.tf = tf;
    try { await this._send({ forget_all: 'candles' }); } catch (e) { /* ignore */ }
    for (const k of [...this.store.keys()]) if (!k.endsWith('|' + tf)) this.store.delete(k);
    await this._subscribeAll();
  }
  candles(code, tf = this.tf) { return this.store.get(`${code}|${tf}`) || []; }
  price(code) { const c = this.candles(code); const p = c.length ? c[c.length - 1].c : 0; return [p, p]; }
  htf(code, tf = this.tf) {
    const g = HTF[tf]; if (!g) return null;
    const key = `${code}|${g}`, e = this.htfStore.get(key), now = this.clock();
    if ((!e || now - e.at > 600000) && !(e && e.loading)) {
      this.htfStore.set(key, { at: now, data: e ? e.data : null, loading: true });
      const meta = this.metas.find(m => m.code === code) || { code };
      this._loadCandles(meta, g, false).then(data => this.htfStore.set(key, { at: this.clock(), data, loading: false }))
        .catch(() => this.htfStore.set(key, { at: this.clock(), data: e ? e.data : null, loading: false }));
    }
    const cur = this.htfStore.get(key); return cur && cur.data;
  }
  step() {}
  stop() { this.stopping = true; clearInterval(this.hb); try { this.ws && this.ws.close(); } catch (e) { /* ignore */ } this._status('idle', ''); }
}

// ----------------------------------------------------------------- Mock (demo)
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const MOCK_START = { Metals: 2650, Headway: 700000, Gold: 2650, Forex: 1.1, Crypto: 64000, Indices: 18000, Synthetics: 1200, Other: 100 };

const MOCK_NAME = { XAGUSD: 30, XPTUSD: 1000, XPDUSD: 1000 };

class MockFeed {
  constructor({ seed = 7, seedCandles = 2500 } = {}) { this.rand = rng(seed); this.seedCandles = seedCandles; this.s = {}; this.tf = 'M5'; this.metas = []; this.speed = 6; this.state = 'idle'; }
  _rnd() { let t = 0; for (let i = 0; i < 6; i++) t += this.rand(); return t - 3; }
  async start(metas, tf = 'M5') {
    this.tf = tf;
    this.metas = metas.map(m => {
      const p = MOCK_NAME[m.name] ?? (/JPY$/.test(m.name) ? 150 : (MOCK_START[m.category] ?? 100));
      this.s[m.code] = { c: [], tc: 12, tr: 0, sh: 0, n: 0, p, v: m.category === 'Forex' ? 0.0002 : 0.0004 };
      return { ...m, digits: p < 10 ? 5 : p < 500 ? 3 : 2 };
    });
    for (let i = 0; i < this.seedCandles * 12; i++) this._tick();
    this.state = 'live';
    return this.metas;
  }
  _tick() {
    for (const st of Object.values(this.s)) {
      if (!st.c.length || st.tc >= 12) {
        const o = st.c.length ? st.c[st.c.length - 1].c : st.p;
        st.n += 1; st.c.push({ t: 1699920000 + st.n * 60, o, h: o, l: o, c: o }); st.tc = 0;
        if (st.c.length > 4000) st.c.splice(0, st.c.length - 4000);
      }
      st.tr = st.tr * 0.98 + this._rnd() * 0.2; st.sh *= 0.8;
      const c = st.c[st.c.length - 1];
      c.c *= 1 + st.v * (this._rnd() * 0.5 + st.tr * 0.3 + st.sh);
      c.h = Math.max(c.h, c.c); c.l = Math.min(c.l, c.c); st.tc += 1;
    }
  }
  step() { for (let i = 0; i < this.speed; i++) this._tick(); }
  shock(code, dir = 1) { this.s[code].sh = dir * 1.6; }
  status() { return { state: this.state, msg: 'Demo mode - simulated prices', ready: this.metas.length, total: this.metas.length, lastMsg: Date.now() }; }
  onStatus() {}
  async setTimeframe(tf) { this.tf = tf; }
  candles(code, tf = this.tf) {
    const sec = TF_SECONDS[tf], out = [], base = this.s[code].c, f = Math.max(1, sec / 60);
    for (const b of base.slice(-(300 * f + f))) {
      const key = Math.floor(b.t / sec) * sec, last = out[out.length - 1];
      if (last && last.t === key) { last.h = Math.max(last.h, b.h); last.l = Math.min(last.l, b.l); last.c = b.c; }
      else out.push({ t: key, o: b.o, h: b.h, l: b.l, c: b.c });
    }
    return out.slice(-300);
  }
  price(code) { const p = this.s[code].c.at(-1).c; return [p, p]; }
  htf(code, tf = this.tf) { const g = HTF[tf]; return g ? this.candles(code, g).slice(-120) : null; }
  stop() { this.state = 'idle'; }
}


// ------------------------------------------------- Broker bridge (MetaApi cloud -> your own MT5 account)
// Headway's synthetic indices exist only on Headway's MT5 servers. MetaApi (a third-party cloud service) connects to
// your Headway MT5 account in the cloud (use the read-only INVESTOR password) and exposes its prices over HTTPS,
// so a phone can read them without a PC. Endpoints follow MetaApi's public REST documentation.
const META_TF = { M1: '1m', M5: '5m', M15: '15m', M30: '30m', H1: '1h', H4: '4h', D1: '1d' };

class MetaApiFeed {
  constructor({ token, accountId, region = 'new-york', suffix = '', fetchImpl = globalThis.fetch, clock = () => Date.now(), pollMs = 3000, resyncMs = 30000 } = {}) {
    Object.assign(this, { token, accountId, region, suffix, fetchImpl, clock, pollMs, resyncMs });
    this.metas = []; this.store = new Map(); this.prices = new Map(); this.htfStore = new Map(); this.synced = new Map();
    this.tf = 'M5'; this.state = 'idle'; this.msg = ''; this.timer = null; this.polling = false; this.listeners = new Set(); this.lastMsg = 0;
  }
  get md() { return `https://mt-market-data-client-api-v1.${this.region}.agiliumtrade.ai/users/current/accounts/${encodeURIComponent(this.accountId)}`; }
  get cl() { return `https://mt-client-api-v1.${this.region}.agiliumtrade.ai/users/current/accounts/${encodeURIComponent(this.accountId)}`; }
  onStatus(fn) { this.listeners.add(fn); }
  _status(state, msg = '') { this.state = state; this.msg = msg; this.listeners.forEach(f => f(this.status())); }
  status() { return { state: this.state, msg: this.msg, ready: this.metas.filter(m => this.store.has(`${m.code}|${this.tf}`)).length, total: this.metas.length, lastMsg: this.lastMsg }; }
  sym(m) { return encodeURIComponent(m.code + this.suffix); }

  async _get(url) {
    let r;
    try { r = await this.fetchImpl(url, { headers: { 'auth-token': this.token, Accept: 'application/json' } }); }
    catch (e) { throw new Error('The browser could not reach MetaApi (no internet, or the request was blocked)'); }
    if (r.status === 401 || r.status === 403) throw new Error('MetaApi rejected the token - check the token and the account ID');
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) { /* no body */ } throw new Error(m || `MetaApi error ${r.status}`); }
    this.lastMsg = this.clock();
    return r.json();
  }
  async _candles(m, tf, limit = 300) {
    const rows = await this._get(`${this.md}/historical-market-data/symbols/${this.sym(m)}/timeframes/${META_TF[tf]}/candles?limit=${limit}`);
    return (Array.isArray(rows) ? rows : []).map(c => ({ t: Math.floor(Date.parse(c.time) / 1000), o: +c.open, h: +c.high, l: +c.low, c: +c.close }))
      .filter(c => Number.isFinite(c.t) && Number.isFinite(c.c)).sort((a, b) => a.t - b.t);
  }
  async _loadMeta(m) {
    try {
      try { const spec = await this._get(`${this.cl}/symbols/${this.sym(m)}/specification`); if (spec && Number.isFinite(+spec.digits)) m.digits = +spec.digits; } catch (e) { /* spec optional */ }
      const arr = await this._candles(m, this.tf);
      if (!arr.length) throw new Error('no candles returned (is the symbol name exact?)');
      if (m.digits === undefined || m.digits === null) m.digits = Math.max(...arr.slice(-20).map(c => (String(c.c).split('.')[1] || '').length), 0);
      this.store.set(`${m.code}|${this.tf}`, arr); m.error = '';
    } catch (e) { m.error = e.message; throw e; }
  }
  async start(metas, tf = 'M5') {
    if (!this.token || !this.accountId) throw new Error('Broker bridge is not set up (needs a MetaApi token and account ID)');
    this.tf = tf; this.metas = metas.map(m => ({ ...m })); this._status('connecting', 'Connecting to your broker through MetaApi...');
    let firstErr = null;
    for (let i = 0; i < this.metas.length; i += 3) {
      await Promise.all(this.metas.slice(i, i + 3).map(m => this._loadMeta(m).catch(e => { firstErr = firstErr || e; })));
    }
    const ok = this.metas.filter(m => this.store.has(`${m.code}|${tf}`));
    if (!ok.length) { this._status('error', firstErr ? firstErr.message : 'No data'); throw firstErr || new Error('No data'); }
    this._status('live', ''); this._startPolling();
    return ok;
  }
  _startPolling() { clearInterval(this.timer); if (this.pollMs) this.timer = setInterval(() => this._poll(), this.pollMs); }
  async _poll() {
    if (this.polling || this.state === 'idle') return; this.polling = true;
    try {
      const live = this.metas.filter(m => this.store.has(`${m.code}|${this.tf}`));
      for (let i = 0; i < live.length; i += 4) await Promise.all(live.slice(i, i + 4).map(m => this._tickOne(m)));
      if (this.state === 'reconnecting') this._status('live', '');
    } finally { this.polling = false; }
  }
  async _tickOne(m) {
    const key = `${m.code}|${this.tf}`, arr = this.store.get(key), sec = TF_SECONDS[this.tf];
    try {
      const p = await this._get(`${this.cl}/symbols/${this.sym(m)}/current-price`);
      const bid = +p.bid, ask = +p.ask;
      if (!(bid > 0)) return;
      this.prices.set(m.code, [bid, ask > 0 ? ask : bid]);
      const now = Math.floor(this.clock() / 1000), last = arr[arr.length - 1], slot = Math.floor(now / sec) * sec;
      if (last && slot > last.t) arr.push({ t: slot, o: last.c, h: Math.max(last.c, bid), l: Math.min(last.c, bid), c: bid });
      else if (last) { last.c = bid; last.h = Math.max(last.h, bid); last.l = Math.min(last.l, bid); }
      if (arr.length > 400) arr.shift();
      if (this.clock() - (this.synced.get(key) || 0) > this.resyncMs) {       // correct drift with the broker's own candles
        this.synced.set(key, this.clock());
        const fresh = await this._candles(m, this.tf, 5);
        for (const c of fresh) { const i = arr.findIndex(x => x.t === c.t); if (i >= 0) arr[i] = c; else if (c.t > arr[arr.length - 1].t) arr.push(c); }
      }
    } catch (e) { if (this.state === 'live') this._status('reconnecting', e.message); }
  }
  async setTimeframe(tf) {
    if (tf === this.tf) return;
    this.tf = tf; this.store.clear();
    for (let i = 0; i < this.metas.length; i += 3) await Promise.all(this.metas.slice(i, i + 3).map(m => this._loadMeta(m).catch(() => {})));
  }
  candles(code, tf = this.tf) { return this.store.get(`${code}|${tf}`) || []; }
  price(code) { const p = this.prices.get(code); if (p) return p; const c = this.candles(code); const v = c.length ? c[c.length - 1].c : 0; return [v, v]; }

class CompositeFeed {
  constructor(feeds) { this.feeds = feeds; this.route = new Map(); this.errors = {}; this.metas = []; this.listeners = new Set(); this.tf = 'M5'; }
  get active() { return (this.feeds.deriv && this.feeds.deriv.active) || []; }
  get skipped() { return (this.feeds.deriv && this.feeds.deriv.skipped) || []; }
  get tried() { return this.feeds.deriv && this.feeds.deriv.tried; }

  onStatus(fn) { for (const f of Object.values(this.feeds)) if (f.onStatus) f.onStatus(() => fn(this.status())); }
  async start(metas, tf = 'M5') {
    this.tf = tf; this.errors = {}; this.route.clear(); const ok = [], jobs = [];
    for (const [src, feed] of Object.entries(this.feeds)) {
      const mine = metas.filter(m => (m.src || 'deriv') === src);

      jobs.push(feed.start(mine, tf).then(list => { list.forEach(m => this.route.set(m.code, feed)); ok.push(...list); }).catch(e => { this.errors[src] = e.message; }));
    }
    await Promise.all(jobs);

    if (!ok.length) throw new Error(Object.values(this.errors)[0] || 'No data sources are available');
    return ok;
  }
  _f(code) { return this.route.get(code); }
  candles(code, tf) { const f = this._f(code); return f ? f.candles(code, tf) : []; }
  price(code) { const f = this._f(code); return f ? f.price(code) : [0, 0]; }
  htf(code, tf) { const f = this._f(code); return f ? f.htf(code, tf) : null; }
  async setTimeframe(tf) { this.tf = tf; await Promise.all(Object.values(this.feeds).map(f => f.setTimeframe(tf).catch(() => {}))); }
  step() { Object.values(this.feeds).forEach(f => f.step && f.step()); }
  stop() { Object.values(this.feeds).forEach(f => f.stop && f.stop()); }
  status() {
    const ss = Object.values(this.feeds).map(f => f.status()), live = ss.filter(x => x.state === 'live');
    const state = live.length ? 'live' : ss.some(x => x.state === 'reconnecting') ? 'reconnecting' : ss.some(x => x.state === 'connecting') ? 'connecting' : ss[0] ? ss[0].state : 'idle';
    return { state, msg: ss.map(x => x.msg).filter(Boolean)[0] || '', ready: ss.reduce((a, x) => a + x.ready, 0), total: ss.reduce((a, x) => a + x.total, 0), lastMsg: Math.max(0, ...ss.map(x => x.lastMsg || 0)) };
  }
}

// ---- brain.js
// The scanner's "brain": market regime + self-learning from its own results. Runs on the phone, no key needed.
function regimeOf(K) {
  const n = K.length;
  if (n < 60) return { label: 'UNKNOWN', er: 0, vr: 1, dir: 0 };
  const w = K.slice(-31), net = w.at(-1).c - w[0].c;
  let path = 0;
  for (let i = 1; i < w.length; i++) path += Math.abs(w[i].c - w[i - 1].c);
  const er = path > 0 ? Math.abs(net) / path : 0;
  const trs = [];
  for (let i = Math.max(1, n - 100); i < n; i++) { const k = K[i], p = K[i - 1]; trs.push(Math.max(k.h - k.l, Math.abs(k.h - p.c), Math.abs(k.l - p.c))); }
  const sorted = [...trs].sort((a, b) => a - b), med = sorted[Math.floor(sorted.length / 2)] || 0;
  const recent = trs.slice(-14).reduce((a, b) => a + b, 0) / 14, vr = med > 0 ? recent / med : 1;
  const label = vr > 2 ? 'VOLATILE' : vr < 0.5 ? 'DEAD' : er >= 0.3 ? 'TRENDING' : er < 0.15 ? 'RANGING' : 'MIXED';
  return { label, er, vr, dir: net > 0 ? 1 : -1 };
}
function trackRecord(book, strategy, symbol) {
  let w = 0, l = 0;
  for (const g of book.signals.values()) {
    if (g.strategy !== strategy || (symbol && g.symbol !== symbol)) continue;
    if (g.hits >= 1 || g.state === 'COMPLETED') w++; else if (g.state === 'SL_HIT') l++;
  }
  return { w, l, n: w + l };
}
function brainAdjust(name, s, m, K, book) {
  const rg = regimeOf(K), notes = [];
  if (rg.label === 'DEAD') return { skip: true, regime: rg.label, delta: 0, notes };
  let d = 0; const trendy = !['SHADOW_ENTRY', 'SUPPORT_RESISTANCE', 'MEAN_REVERSION', 'ZONE_TO_ZONE'].includes(name);   // rejection/bounce trades behave like reversals
  if (rg.label === 'TRENDING') {
    if (trendy) { if (s.dir === rg.dir) { d += 5; notes.push('Brain: the market is trending and this trade goes with it (+5)'); } else { d -= 8; notes.push('Brain: a strong trend is running against this trade (-8)'); } }
    else if (s.dir !== rg.dir) { d -= 5; notes.push('Brain: reversal against a strong trend (-5)'); }
  } else if (rg.label === 'RANGING') {
    if (trendy) { d -= 6; notes.push('Brain: the market is ranging, which hurts trend-following setups (-6)'); }
    else { d += 5; notes.push('Brain: the market is ranging, which suits rejection trades (+5)'); }
  } else if (rg.label === 'VOLATILE') { d -= 5; notes.push('Brain: volatility is more than double normal - wider swings, less reliable (-5)'); }
  let tr = trackRecord(book, name, m.name), scope = m.name;
  if (tr.n < 4) { tr = trackRecord(book, name, null); scope = 'all symbols'; if (tr.n < 8) tr = { w: 0, l: 0, n: 0 }; }
  if (tr.n >= 4) {
    const wr = tr.w / tr.n, adj = Math.max(-10, Math.min(10, Math.round((wr - 0.5) * 30 * (tr.n / (tr.n + 8)))));
    if (adj !== 0) { d += adj; notes.push(`Brain: this strategy's record on ${scope} is ${tr.w} wins / ${tr.l} losses (${adj > 0 ? '+' : ''}${adj})`); }
  }
  return { skip: false, regime: rg.label, delta: d, notes };
}

class Scanner {
  constructor({ feed, book, calendar, defaults = {}, tuning = {}, clock = () => Date.now() / 1000, onEvent = () => {} }) {
    this.feed = feed; this.book = book; this.cal = calendar; this.clock = clock; this.onEvent = onEvent;
    this.P = params(tuning);
    this.settings = { strategy: 'ALL', timeframe: 'M5', min_conf: this.P.min_conf, news: true, ...defaults, ...book.settings };
    this.P.min_conf = this.settings.min_conf;
    this.symbols = []; this.analysis = {}; this.candles = {}; this.lastCandle = {}; this.events = [];
    this.cycles = 0; this.lastCycle = 0; this.busy = false;
  }
  setSymbols(metas) { this.symbols = metas; this.lastCandle = {}; this.analysis = {}; this.candles = {}; }

  async updateSettings(n) {
    const s = this.settings, oldTf = s.timeframe;
    if (n.strategy && (n.strategy === 'ALL' || STRATS.includes(n.strategy))) s.strategy = n.strategy;
    if (['M1', 'M5', 'M15', 'M30', 'H1'].includes(n.timeframe)) s.timeframe = n.timeframe;
    if (typeof n.min_conf === 'number') s.min_conf = Math.max(40, Math.min(95, Math.trunc(n.min_conf)));
    if (typeof n.news === 'boolean') s.news = n.news;
    this.P.min_conf = s.min_conf;
    this.book.settings = { ...this.book.settings, strategy: s.strategy, timeframe: s.timeframe, min_conf: s.min_conf, news: s.news };
    this.lastCandle = {}; this.analysis = {}; this.candles = {};
    if (s.timeframe !== oldTf) await this.feed.setTimeframe(s.timeframe);
    this.book.save();
    return { ...s };
  }

  _emit(event, sig, reason = '') {
    let txt = PHRASE[event] || event;
    if (reason) txt += ` (${reason})`;
    const e = { t: this.clock(), event, symbol: sig.symbol, id: sig.id, direction: sig.direction, order_type: sig.order_type,
      strategy: sig.strategy, confidence: sig.confidence, text: `${sig.symbol} ${sig.direction} ${sig.order_type.replace('_', ' ')}: ${txt}` };
    this.events.unshift(e); this.events.length = Math.min(this.events.length, 120);
    this.onEvent(e, sig);
  }

  _blackout(ccys, now) {
    const w = this.P.blackout_min * 60;
    return this.cal.all().some(e => Math.abs(e.ts - now) <= w && ccys.includes(e.ccy));
  }
  static killzone(m, now) {
    if (m.category === 'Crypto' || m.category === 'Synthetics' || m.category === 'Headway') return '';
    const h = new Date(now * 1000).getUTCHours();
    return h >= 7 && h < 10 ? 'London' : h >= 12 && h < 15 ? 'New York' : '';
  }

  _setups(m, closed, now, tf) {
    const names = this.settings.strategy === 'ALL' ? STRATS : [this.settings.strategy];
    const ccys = currencies(m), nb = ccys.length ? this._blackout(ccys, now) : false;
    let H = null;
    { const h = this.feed.htf(m.code, tf); H = h && h.length > 30 ? h.slice(0, -1) : null; }
    const hb = htfUp(H);   // true = higher timeframe up, false = down, null = unknown
    const ctx = { digits: m.digits, kz: Scanner.killzone(m, now) }, out = [];
    for (const name of names) {
      const s = name === 'SHADOW_ENTRY' ? detectShadow(closed, this.P, nb) : name === '714_METHOD' ? (tf === 'M5' ? detect714(closed, this.P, ctx, m, now) : null) : detect(name, closed, H, this.P, ctx);
      if (s && name !== 'SHADOW_ENTRY' && nb) { s.conf -= 10; s.reasons.push('A high-impact news release is within the blackout window (-10 confidence)'); }
      // 2.8 FIX: hard higher-timeframe filter. Trading against the HTF trend was the main source of stop-outs.
      if (s && this.P.htf_filter && name !== '714_METHOD' && hb !== null && (hb ? 1 : -1) !== s.dir) continue;
      if (s) {
        const br = brainAdjust(name, s, m, closed, this.book);
        if (br.skip) continue;
        s.conf = Math.max(1, Math.min(99, Math.round(s.conf + br.delta))); s.reasons.push(...br.notes); s.regime = br.regime;
      }
      if (s && s.conf >= this.P.min_conf) out.push(s);
    }
    return out;
  }

  _newCandle(m, closed, bid, ask, now, tf) {
    const tfs = TF_SECONDS[tf] || 300;
    const setups = this._setups(m, closed, now, tf).sort((a, b) => b.conf - a.conf);
    for (const setup of setups) {
      const sig = buildSignal(m, tf, setup, bid, ask, this.P, now, m.digits);
      if (!sig || this.book.signals.has(sig.id)) continue;
      // 2.8 FIX: cooldown after a loss on the same symbol+direction, and only one live signal per symbol+direction
      const cool = this.P.cooldown_candles * tfs;
      let blocked = false;
      for (const g of this.book.signals.values()) {
        if (g.symbol !== m.name || g.direction !== sig.direction || g.strategy === 'NEWS_STRADDLE') continue;
        if (g.state === 'ACTIVE' || g.state === 'PENDING') { blocked = true; break; }
        if (g.state === 'SL_HIT' && now - g.created < cool) { blocked = true; break; }
      }
      if (blocked) continue;
      // 714 Method: one signal per symbol per session window (not one per continuation candle).
      const sk = sig.strategy === '714_METHOD' ? `714:${m.name}:${setup.code}:${Math.floor((setup.t + 7200) / 86400)}` : '';
      if (sk && this.book.flags.has(sk)) continue;
      for (const old of this.book.live(m.name)) {
        if (old.strategy === sig.strategy && old.state === 'PENDING') { old.state = 'CANCELLED'; this._emit('cancelled', old, 'replaced by a newer setup'); }
      }
      this.book.add(sig); if (sk) this.book.flags.add(sk); this._emit('new', sig);
    }
  }

  _news(m, closed, bid, ask, now, tf) {
    const ccys = currencies(m);
    if (!ccys.length || !this.settings.news) return;
    const lead = this.P.news_lead_min * 60;
    for (const e of this.cal.all()) {
      const dt = e.ts - now, key = `NW:${m.name}:${Math.trunc(e.ts)}`;
      if (ccys.includes(e.ccy) && dt > 0 && dt <= lead && !this.book.flags.has(key)) {
        this.book.flags.add(key);
        for (const sig of buildNewsStraddle(m, tf, e, analyze(closed).atr, bid, ask, this.P, now, m.digits)) { this.book.add(sig); this._emit('new', sig); }
      }
    }
  }

  _process(m) {
    const name = m.name, tf = this.settings.timeframe;
    const c = this.feed.candles(m.code, tf);
    if (c.length < 80) return;
    const closed = c.slice(0, -1), [bid, ask] = this.feed.price(m.code);
    if (!bid || !ask) return;
    const now = this.clock();
    this.candles[name] = c.slice(-300);
    const an = analyze(closed); an.regime = regimeOf(closed).label;
    Object.assign(an, { symbol: name, category: m.category, bid, ask, digits: m.digits, timeframe: tf, code: m.code, label: m.label || name });
    this.analysis[name] = an;
    if (this.lastCandle[name] !== closed.at(-1).t) { this.lastCandle[name] = closed.at(-1).t; this._newCandle(m, closed, bid, ask, now, tf); }
    this._news(m, closed, bid, ask, now, tf);
    for (const s of this.book.live(name)) {
      for (const [ev, reason] of advance(s, bid, ask, now, this.P)) {
        if (ev === 'activated' && s.oco) {
          for (const o of this.book.live(name)) {
            if (o.oco === s.oco && o !== s && o.state === 'PENDING') { o.state = 'CANCELLED'; this._emit('cancelled', o, 'OCO: the opposite stop was triggered'); }
          }
        }
        this._emit(ev, s, reason);
      }
    }
  }

  cycle() {
    if (this.busy) return; this.busy = true;
    try {
      this.feed.step();
      this.cal.refresh().catch(() => {});
      for (const m of this.symbols) { try { this._process(m); } catch (e) { console.error('scan failed for', m.name, e); } }
      this.book.save();
      this.cycles += 1; this.lastCycle = this.clock();
    } finally { this.busy = false; }
  }

  // Everything the chart screen needs for one instrument. Reads the live feed (not the 1-second scan cache)
  // so the forming candle follows every tick, and keeps up to 300 candles so the chart can be scrolled back.
  chartData(name) {
    const an = this.analysis[name], m = this.symbols.find(x => x.name === name);
    if (!an || !m) return null;
    let c = this.feed.candles(m.code, this.settings.timeframe);
    if (!c || c.length < 30) c = this.candles[name];
    if (!c || c.length < 30) return null;
    c = c.slice(-300);
    const cl = c.map(k => k.c);
    return { symbol: name, tf: an.timeframe, digits: an.digits, candles: c, ema20: ema(cl, 20), ema50: ema(cl, 50),
      levels: an.levels, bias: an.bias, signals: this.book.live(name).map(publicSignal) };
  }
  state() {
    return { settings: { ...this.settings }, symbols: this.symbols.map(m => this.analysis[m.name]).filter(Boolean),
      signals: [...this.book.signals.values()].sort((a, b) => b.created - a.created).slice(0, 200).map(publicSignal),
      events: this.events.slice(0, 60), news: this.cal.all().filter(e => e.ts > this.clock() - 3600).slice(0, 12) };
  }
}

// ---- chart.js
// Sharp, MT5-style canvas chart: everything is drawn in whole device pixels (no blur), with a price axis,
// time axis, live price line, crosshair + OHLC read-out, EMA20/50, support/resistance, zones and signal levels.
const THEME = { bg: '#06080b', panel: '#0d1117', grid: '#161c24', gridStrong: '#222b36', text: '#c9d1d9', mut: '#7d8794', up: '#2bd48f', dn: '#ff5a6e',

const defaultView = () => ({ count: 70, offset: 0, offsetF: 0, cross: null });

}

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtTime(t, tf, withDate = false) {
  const d = new Date(t * 1000), hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  if (tf === 'D1') return `${d.getDate()} ${MON[d.getMonth()]}`;

function drawChart(canvas, CD, view = defaultView(), opts = {}) {

    const cx = Math.round(slotX(i)), day = new Date(vis[i].t * 1000).getDate();

    for (let i = 0; i < n; i++) { const v = arr[s + i]; if (v === undefined) continue; const xx = slotX(i), yy = Y(v); i ? x.lineTo(xx, yy) : x.moveTo(xx, yy); }
    x.stroke();
  };

  if (CD.ema50) drawLine(CD.ema50, THEME.gold);

  const tagH = Math.round(16 * D), pending = [];

  const tag = (txt, y, col, textCol) => drawTag(txt, y, col, textCol);       // immediate (live price, crosshair)
  const queueTag = (txt, y, col) => pending.push({ txt, y, col });             // signal levels: spread out so labels never overlap
  for (const g of CD.signals) {
    const buy = g.direction === 'BUY', col = buy ? THEME.up : THEME.dn;
    const si = vis.findIndex(k => k.t === g.candle_t);
    if (g.candle_t && si >= 0) { x.strokeStyle = THEME.gold; x.lineWidth = Math.max(1, Math.round(1.6 * D)); x.beginPath(); x.arc(slotX(si), Y(g.ext) + (buy ? 11 : -11) * D, 6 * D, 0, 7); x.stroke(); }
    const be = Math.abs(Y(g.sl) - Y(g.entry)) <= Math.round(2 * D);
    for (const [name0, v, c, dash] of [['ENTRY', g.entry, col, 0], ['SL', g.sl, THEME.dn, 1], ['TP1', g.tp1, THEME.up, 1], ['TP2', g.tp2, THEME.up, 1], ['TP3', g.tp3, THEME.up, 1]]) {

      x.fillStyle = c;
      if (v > hi || v < lo) { const up = v > hi; queueTag(`${up ? '▲' : '▼'} ${name0}`, up ? Math.round(9 * D) : plotH - Math.round(9 * D), c); continue; }
      const y = Y(v), th = Math.max(1, Math.round((dash ? 1 : 1.8) * D));

  const last = K[total - 1], livePx = last.c, lastUp = last.c >= last.o, liveY = livePx <= hi && livePx >= lo ? Y(livePx) : null;

    if (i && pending[i].y - pending[i - 1].y < tagH) pending[i].y = pending[i - 1].y + tagH;
    if (liveY !== null && Math.abs(pending[i].y - liveY) < tagH) pending[i].y = liveY + tagH * (pending[i].y >= liveY ? 1 : -1) * 1.0;   // ... and from the live price tag
  }

  x.fillText(title, 8 * D, 16 * D);
  x.font = font(11);
  const parts = [['O', ro.o], ['H', ro.h], ['L', ro.l], ['C', ro.c]];

}

      body: JSON.stringify({ model: app.ai.model || 'claude-sonnet-5-5', max_tokens: 500,
        system: 'You are a veteran trader with 40 years across forex, metals, indices and synthetic indices, acting as a sceptical risk analyst for an automated scanner. Judge ONE signal using only the data given. Be honest: if the setup is weak, against the trend, near news, or the stop is badly placed, say so. Never promise profit. Reply with ONLY a JSON object: {"verdict":"TAKE"|"WAIT"|"SKIP","confidence_adjust":integer from -15 to 15,"summary":"max 35 words, plain spoken English, no symbols","risks":["max 3 short items"],"management":"max 20 words on how to manage the trade"}',

<p class="mu">Signals and settings are stored only on this phone.<br>Armageddon Chart Scanner 2.8 - rule-based signals, not financial advice. 714 Method uses fixed SAST session windows and an M5 pullback/continuation rule; its 50-pip distance depends on the instrument and broker pip convention. News calendar events are not the same as verified live fundamental analysis. Crude Oil WTI requires a connected broker bridge and a matching broker symbol. The app has no licence-key system. Strategies are not independently backtested or validated for profitability; test on a demo account first.</p></section>`;
}

function mountTab() { const v = $('view'); ui.lastHTML = {}; v.innerHTML = MOUNT[ui.tab](); v.scrollTop = 0; window.scrollTo(0, 0); syncControls(); }
function syncControls() {
  if (!scanner) return;
  const cfg = scanner.settings, tf = $('tf'), mc = $('mc'), nws = $('nws');
  if (tf) tf.innerHTML = V.selectOptions(['M1', 'M5', 'M15', 'M30', 'H1'], cfg.timeframe);
  if (mc) mc.innerHTML = V.selectOptions([50, 60, 70, 80, 90], cfg.min_conf);
  if (nws) nws.checked = cfg.news;
}
function selSymbol() { const s = scanner.symbols; if (!s.find(x => x.name === ui.sel)) ui.sel = s[0] ? s[0].name : null; return ui.sel; }

// ---- live chart (smooth, MT5-style)
function chartFrame(ts) {
  const sym = selSymbol(), cv = $('cv');
  if (!sym || !cv) return;
  if (!cd || cd.symbol !== sym || ts - cdAt > 200) { cd = scanner.chartData(sym); cdAt = ts; }
  if (!cd) return;
  const K = cd.candles, last = K[K.length - 1];
  if (anim.sym !== sym || anim.t !== last.t || anim.c === undefined) anim = { sym, t: last.t, c: last.c };
  anim.c += (last.c - anim.c) * 0.35; if (Math.abs(last.c - anim.c) < (cd.atr || 1e-9) * 1e-4 + 1e-12) anim.c = last.c;
  const shown = { ...cd, candles: [...K.slice(0, -1), { ...last, c: anim.c, h: Math.max(last.h, anim.c), l: Math.min(last.l, anim.c) }] };
  chartInfo = drawChart(cv, shown, ui.view, { t: ts, tf: cd.tf, title: sym });
  lastDraw = ts;
}
function chartLoop(ts) {
  rafOn = false;
  if (ui.tab !== 'chart' || (typeof document !== 'undefined' && document.hidden)) return;
  if (ts - lastDraw > 30) chartFrame(ts);
  rafOn = true; requestAnimationFrame(chartLoop);
}
function startChartLoop() { if (typeof requestAnimationFrame === 'function' && !rafOn) { rafOn = true; requestAnimationFrame(chartLoop); } }
function resetView() { ui.view = defaultView(); cdAt = 0; }

function render() {
  renderHeader();
  if (!scanner || $('view') === null) return;
  if (!$('view').dataset.tab || $('view').dataset.tab !== ui.tab) { $('view').dataset.tab = ui.tab; mountTab(); }
  if (document.body && document.body.classList) document.body.classList.toggle('fs', ui.full && ui.tab === 'chart');
  const st = scanner.state(), t = now();
  setHTML('banner', banner());
  if (ui.tab === 'scan') {
    setHTML('hw-card', headwayCard());
    setHTML('scan-strat', V.stratChips(st.settings.strategy));
    setHTML('scan-desc', V.esc((STRATEGY_INFO[st.settings.strategy] || STRATEGY_INFO.ALL).desc));
    setHTML('scan-cats', V.catChips(st.symbols, ui.cat));
    setHTML('scan-list', ui.booting ? '<p class="mu pad">Connecting to the market feed…</p>' : V.instrumentList(st, ui.cat, selSymbol()));
    const tf = $('tf'), mc = $('mc');
    if (tf && document.activeElement !== tf) tf.value = st.settings.timeframe;
    if (mc && document.activeElement !== mc) mc.value = st.settings.min_conf;
  } else if (ui.tab === 'chart') {
    const sym = selSymbol(), x = st.symbols.find(q => q.symbol === sym);
    setHTML('ch-title', x ? `<b>${V.esc(x.symbol)}</b> <span class="mu">${V.esc(x.category)}</span><div class="px">${x.bid.toFixed(x.digits)} <small class="${x.bias === 'UP' ? 'up' : 'dn'}">${x.bias === 'UP' ? '▲ bullish' : '▼ bearish'} · RSI ${x.rsi.toFixed(0)}</small></div>` : '<span class="mu">Waiting for prices…</span>');
    setHTML('ch-tf', ['M1', 'M5', 'M15', 'M30', 'H1'].map(f => `<button class="chip sm ${f === st.settings.timeframe ? 'on' : ''}" data-act="tf" data-v="${f}">${f}</button>`).join(''));
    if (sym) chartFrame(typeof performance !== 'undefined' ? performance.now() : Date.now());
    startChartLoop();
    const mine = st.signals.filter(g => g.symbol === sym && V.isLive(g));
    setHTML('ch-sigs', mine.length ? mine.map(g => V.sigCard(g, t)).join('') : '<p class="mu pad">No live signal on this pair right now. Swipe ‹ › to scan the next pair.</p>');
  } else if (ui.tab === 'signals') {
    setHTML('sg-tabs', V.signalTabs(st, ui.sigTab));
    setHTML('sg-list', V.signalList(st, ui.sigTab, t));
  } else if (ui.tab === 'news') {
    setHTML('nw-status', V.esc(calendar.status));
    setHTML('nw-list', V.newsList(st.news, t));
  } else if (ui.tab === 'settings') {
    const el = $('set-status'); if (el) el.textContent = V.pillText(feedStatus());
    setHTML('set-detail', V.esc(feedDetail()));
    const bs = $('br-status'); if (bs) bs.textContent = bridgeStatus();
    setHTML('banner', banner());
  }
}
function step(dir) {
  const s = scanner.symbols; if (!s.length) return;
  const i = Math.max(0, s.findIndex(x => x.name === ui.sel));
  ui.sel = s[(i + dir + s.length) % s.length].name; resetView(); render();
}

// ------------------------------------------------------------------- events
const ACT = {
  goto: el => { ui.tab = el.dataset.tab; if (ui.tab !== 'chart') ui.full = false; render(); },
  strat: async el => { const k = el.dataset.v; await scanner.updateSettings({ strategy: k, timeframe: STRATEGY_INFO[k].tf }); resetView(); syncControls(); render(); },
  cat: el => { ui.cat = el.dataset.v; render(); },
  pick: el => { ui.sel = el.dataset.sym; ui.tab = 'chart'; resetView(); render(); },
  prev: () => step(-1), next: () => step(1),
  tf: async el => { await scanner.updateSettings({ timeframe: el.dataset.v }); resetView(); render(); },
  zin: () => { if (cd) { zoomBy(ui.view, 1.3, cd.candles.length); chartFrame(performance.now()); } },
  zout: () => { if (cd) { zoomBy(ui.view, 1 / 1.3, cd.candles.length); chartFrame(performance.now()); } },
  zreset: () => { resetView(); render(); },
  full: () => { ui.full = !ui.full; render(); setTimeout(() => render(), 60); },
  sigtab: el => { ui.sigTab = el.dataset.v; render(); },
  png: () => {
    const cv = $('cv'); if (!cv) return;
    cv.toBlob(async b => {
      if (!b) return;
      const file = new File([b], `${ui.sel || 'chart'}.png`, { type: 'image/png' });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: ui.sel }); return; } } catch (e) { /* cancelled */ }
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = file.name; a.click();
    });
  },
  addNews: () => {
    const title = $('nw-title').value.trim(), v = $('nw-time').value;
    if (!title || !v) { toast('Enter an event name and a time'); return; }
    calendar.addManual(title, $('nw-ccy').value, new Date(v).getTime() / 1000); $('nw-title').value = ''; toast('Event added'); ui.lastHTML['nw-list'] = null; render();
  },
  delNews: el => { calendar.removeManual(+el.dataset.id); ui.lastHTML['nw-list'] = null; render(); },
  source: async el => { app.source = el.dataset.v; saveApp(); $('view').dataset.tab = ''; await boot(); },
  retry: async () => { ui.error = ''; await boot(); },
  useDemo: async () => { app.source = 'demo'; saveApp(); await boot(); },
  saveBridge: async () => {
    app.bridge = { token: $('br-token').value.trim(), accountId: $('br-acc').value.trim(), region: $('br-region').value || 'new-york', suffix: $('br-suffix').value.trim() };
    saveApp();
    if (!bridgeOn()) { toast('Enter both the MetaApi token and the account ID'); return; }
    toast('Connecting the Headway bridge…'); await boot();
  },
  clearBridge: async () => { app.bridge = { ...DEF.bridge }; saveApp(); toast('Bridge removed'); await boot(); },
  addSymbol: async () => {
    const raw = ($('br-add').value || '').trim().toUpperCase();
    if (!/^[A-Z0-9_.]{2,30}$/.test(raw)) { toast('Enter the exact broker symbol, e.g. VOL_30 or USOIL'); return; }
    const oil = /WTI|USOIL|XTIUSD|BRENT|UKOIL|OIL/i.test(raw);
    if (!knownInstrument(raw)) app.extra[raw] = { code: raw, name: oil && /WTI|USOIL|XTIUSD/i.test(raw) ? 'Crude Oil WTI' : raw, label: oil && /WTI|USOIL|XTIUSD/i.test(raw) ? `Crude Oil WTI (${raw})` : `${raw} (${oil ? 'Energies' : 'Broker'})`, category: oil ? 'Energies' : 'Headway', src: 'meta' };
    if (!app.instruments.includes(raw)) app.instruments.push(raw);
    saveApp(); $('br-add').value = ''; toast(`${raw} added`); if (bridgeOn() || app.source === 'demo') await boot(); else ui.lastHTML = {}, $('view').dataset.tab = '', render();
  },
  applyInstr: async () => {
    const codes = [...document.querySelectorAll('#picker input[data-code]:checked')].map(i => i.dataset.code);
    if (!codes.length) { toast('Pick at least one instrument'); return; }
    if (codes.length > 30) { toast('Please pick 30 or fewer'); return; }
    if (feed && feed.active) for (const a of feed.active) if (codes.includes(a.code) && !knownInstrument(a.code)) app.extra[a.code] = { code: a.code, name: a.label, label: a.label, category: a.category };
    app.instruments = codes; saveApp(); toast('Restarting scan…'); await boot();
  },
  askAI: el => { const g = book.signals.get(el.dataset.id); if (g) aiReview(g, true); },
  saveAI: () => {
    app.ai.key = ($('ai-key').value || '').trim(); app.ai.model = ($('ai-model').value || '').trim() || 'claude-sonnet-5-5'; saveApp();
    toast(!app.ai.key ? 'AI key cleared' : app.ai.key.startsWith('sk-ant-') ? 'AI settings saved' : 'Saved, but the key does not look like an Anthropic key (sk-ant-...)');
  },
  testVoice: () => { if (!('speechSynthesis' in window)) { toast('This browser has no speech support'); return; } speak('Armageddon analyst online. Voice check complete.', true); },
  briefing: () => { if (!scanner || !scanner.symbols.length) { toast('Scanner is not running yet'); return; } const t = briefingText(); toast(t); speak(t, true); },
  savePips: () => {
    const out = {}; let bad = 0;
    for (const part of ($('pip-map').value || '').split(/[,\n;]+/)) {
      const t = part.trim(); if (!t) continue;
      const m = t.match(/^([A-Za-z0-9_. ]+?)\s*=\s*([0-9]*\.?[0-9]+)$/);
      if (!m || !(+m[2] > 0)) { bad++; continue; }
      out[m[1].trim().toUpperCase()] = +m[2];
    }
    app.pips = out; saveApp(); if (scanner) scanner.P.pips = out;
    toast(bad ? `Saved. ${bad} entry skipped - use SYMBOL=size` : 'Pip sizes saved');
  },
  calcRisk: () => {
    const balance = Math.max(0, Number($('risk-balance').value) || 0);
    const percent = Math.max(0, Math.min(100, Number($('risk-percent').value) || 1));
    const stopDistance = Math.max(0, Number($('risk-stop').value) || 0);
    const valuePerUnit = Math.max(0, Number($('risk-value').value) || 0);
    app.risk = { balance: $('risk-balance').value, percent: $('risk-percent').value || '1', stopDistance: $('risk-stop').value, valuePerUnit: $('risk-value').value };
    saveApp();
    const budget = balance * percent / 100;
    let result = `<b>Planned risk budget:</b> ${budget.toFixed(2)} (${percent}% of ${balance.toFixed(2)} balance).`;
    if (stopDistance > 0 && valuePerUnit > 0 && budget > 0) {
      const lot = budget / (stopDistance * valuePerUnit);
      result += `<br><b>Estimated position size:</b> ${lot.toFixed(4)} lots (before broker volume-step/min/max rounding).`;
    } else {
      result += '<br>Enter stop distance and broker-confirmed value per price unit per 1.00 lot to estimate lots.';
    }
    $('risk-result').innerHTML = result;
  },
  install: async () => { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } },
  clearSignals: () => { book.signals.clear(); book.save(); toast('Signal history cleared'); render(); },
  resetApp: () => { if (confirm('Reset all settings and signal history on this phone?')) { Object.keys(localStorage).filter(k => k.startsWith('acs_')).forEach(k => store.removeItem(k)); location.reload(); } },
};
const CHG = {
  tf: async el => { await scanner.updateSettings({ timeframe: el.value }); resetView(); render(); },
  mc: async el => { await scanner.updateSettings({ min_conf: +el.value }); render(); },
  news: async el => { await scanner.updateSettings({ news: el.checked }); },
  tour: el => { ui.tour = el.checked; },
  appid: el => { app.appId = el.value.replace(/\D/g, '') || 1089; saveApp(); },
  'a-sound': el => { app.alerts.sound = el.checked; saveApp(); if (el.checked) beep(); },
  'a-vibrate': el => { app.alerts.vibrate = el.checked; saveApp(); if (el.checked && navigator.vibrate) navigator.vibrate(60); },
  'a-voice': el => {
    app.alerts.voice = el.checked;
    saveApp();
    if (el.checked && 'speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance('Armageddon voice alerts enabled.')); }
      catch (e) { toast('Voice alerts may not be supported by this browser'); }
    } else if (el.checked) {
      el.checked = false; app.alerts.voice = false; saveApp(); toast('Voice alerts are not supported by this browser');
    } else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  },
  'a-notify': async el => {
    if (el.checked && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
    app.alerts.notify = el.checked && 'Notification' in window && Notification.permission === 'granted';
    if (el.checked && !app.alerts.notify) { el.checked = false; toast('Notifications are blocked for this site'); } saveApp();
  },
  'ai-on': el => { if (el.checked && !app.ai.key) { el.checked = false; toast('Save your Claude API key first'); return; } app.ai.on = el.checked; saveApp(); },
  'v-name': el => { app.voice.name = el.value; saveApp(); speak('Armageddon analyst online.', true); },
  'v-rate': el => { app.voice.rate = +el.value; saveApp(); speak('Speech speed updated.', true); },
  'v-out': el => { app.voice.outcomes = el.checked; saveApp(); },
  wake: el => { app.wake = el.checked; saveApp(); keepAwake(); },
};

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) { if (audio && audio.state === 'suspended') audio.resume(); ACT[el.dataset.act](el, e); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); loop(); } });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('install'); if (b) b.hidden = false; });

// chart gestures (pointer events): drag = scroll, pinch = zoom, tap = crosshair, double-tap = reset, wheel = zoom
const pts = new Map(); let pinchD = 0, moved = false, downAt = 0, lastTap = 0;
const rel = e => { const r = e.target.getBoundingClientRect ? e.target.getBoundingClientRect() : { left: 0, top: 0 }; return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const total = () => (cd ? cd.candles.length : 0);
document.addEventListener('pointerdown', e => {
  if (e.target.id !== 'cv') return;
  if (e.target.setPointerCapture) { try { e.target.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } }
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; downAt = Date.now();
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
});
document.addEventListener('pointermove', e => {
  if (e.target.id !== 'cv') return;
  const p = pts.get(e.pointerId);
  if (!p) { if (e.pointerType === 'mouse') { ui.view.cross = rel(e); chartFrame(performance.now()); } return; }
  if (pts.size === 2) {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0 && total()) zoomBy(ui.view, d / pinchD, total()); pinchD = d; moved = true; ui.view.cross = null; return;
  }
  const dx = e.clientX - p.x; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (Math.abs(dx) > 0.5) moved = true;
  if (ui.view.cross) ui.view.cross = rel(e);
  else if (total() && chartInfo) panBy(ui.view, dx / chartInfo.slotW, total());
});
const endPtr = e => {
  if (e.target.id !== 'cv') return;
  pts.delete(e.pointerId);
  if (!moved && Date.now() - downAt < 350) {
    if (Date.now() - lastTap < 320) { resetView(); lastTap = 0; } else { ui.view.cross = ui.view.cross ? null : rel(e); lastTap = Date.now(); }
  }
};
document.addEventListener('pointerup', endPtr);
document.addEventListener('pointercancel', e => { if (e.target.id === 'cv') pts.delete(e.pointerId); });
document.addEventListener('wheel', e => { if (e.target.id === 'cv' && total()) { if (e.preventDefault) e.preventDefault(); zoomBy(ui.view, e.deltaY < 0 ? 1.12 : 1 / 1.12, total()); } }, { passive: false });
window.addEventListener('resize', () => { if (ui.tab === 'chart') render(); });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
setInterval(loop, 1000);
globalThis.__acs = { get scanner() { return scanner; }, get feed() { return feed; }, ui, app };
boot();

</script>
